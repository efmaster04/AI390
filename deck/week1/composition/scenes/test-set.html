  <script>
    BK.scene("test-set", function (tl, root, BK) {
      var $ = function (s) { return root.querySelectorAll(s); };
      var cards = $(".ts-card");
      BK.frame(tl, root, 0);

      // 0 → 1.4: 25 kart deste olarak dökülür (5x5), sayaç 25'e sayar, gerçek örnek kart çarpar
      BK.count(tl, "#ts-n", 25, 0.25, { duration: 0.8 });
      BK.rise(tl, ["#ts-head-k", "#ts-head-s"], 0.35, { y: 14, duration: 0.4 });
      Array.prototype.forEach.call(cards, function (c, i) {
        var dx = +c.getAttribute("data-dx"), dy = +c.getAttribute("data-dy");
        tl.fromTo(c, { opacity: 0, x: dx, y: dy - 26, rotation: -1.5, scale: 1.04 },
          { opacity: 1, x: dx, y: dy, rotation: 0, scale: 1, duration: 0.36, ease: BK.EASE.slam }, 0.3 + i * 0.022);
      });
      BK.slam(tl, "#ts-sample", 0.45, { duration: 0.45 });
      BK.mascotIn(tl, "#ts-mascot", 0.3, { from: "bottom" });

      // 1.45 → 2.5: kartlar kategori satırlarına dizilir; etiketler ve sayılar gelir
      Array.prototype.forEach.call(cards, function (c, i) {
        var dx = +c.getAttribute("data-dx"), dy = +c.getAttribute("data-dy");
        BK.travel(tl, c, 1.45 + i * 0.008, { x: dx, y: dy }, { x: 0, y: 0 }, { duration: 0.55, later: true });
      });
      BK.rise(tl, $(".ts-row-l"), 1.55, { y: 0, duration: 0.35, stagger: 0.04 });
      BK.formula(tl, $(".ts-row-n"), 1.8, { stagger: 0.04 });
      BK.note(tl, "#ts-note", 2.0);
      BK.mascotReact(tl, "#ts-mascot", 1.5, { kind: "hop" });

      // 2.55 → 3.6: dil çubuğu 13 TR / 12 EN
      BK.rise(tl, "#ts-lang-l", 2.55, { y: 0, duration: 0.3 });
      BK.slam(tl, "#ts-lang", 2.55, { duration: 0.4 });
      BK.bars(tl, ["#ts-lang-tr", "#ts-lang-en"], 2.7, { stagger: 0.12, duration: 0.5 });
      BK.fade(tl, ["#ts-lang-trv", "#ts-lang-env"], 2.95, { stagger: 0.1, duration: 0.25 });
      BK.count(tl, "#ts-tr-n", 13, 2.9, { duration: 0.45 });
      BK.count(tl, "#ts-en-n", 12, 2.93, { duration: 0.45 });
      BK.mascotReact(tl, "#ts-mascot", 2.6, { kind: "tilt", angle: -3 });

      // 3.65 → 4.7: sekiz bileşen ve sayıları; W1-11'in bileşenleri (3 + 8) iki yerde birden çizilir; damga
      BK.slam(tl, "#ts-ingr", 3.65, { duration: 0.45 });
      BK.rise(tl, $(".ts-ing"), 3.8, { y: 10, duration: 0.3, stagger: 0.035 });
      BK.scan(tl, ["#ts-meta-ing", "#ts-ing3", "#ts-ing8"], 4.05, { duration: 0.35, stagger: 0.05 });
      BK.stamp(tl, "#ts-stamp", 4.15, { rotation: -3 });
      BK.mascotReact(tl, "#ts-mascot", 3.7, { kind: "hop" });
    });
