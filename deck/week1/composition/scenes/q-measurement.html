<template id="q-measurement-template">
  <style>
    #root { position: absolute; inset: 0; }
    [data-composition-id="q-measurement"] .qm-hero { position: absolute; left: var(--edge-x); top: 330px; width: 600px; height: 330px; display: flex; align-items: center; justify-content: center; gap: 22px; }
    [data-composition-id="q-measurement"] .qm-hero .bk-bigfig { align-items: center; }
    [data-composition-id="q-measurement"] .qm-x { font-family: var(--font-display); font-weight: 900; font-size: 110px; line-height: 1; padding-bottom: 40px; }
    [data-composition-id="q-measurement"] .qm-dots { left: 136px; top: 370px; width: 600px; height: 330px; }
    [data-composition-id="q-measurement"] .qm-panels { position: absolute; left: 780px; top: 340px; width: 1044px; display: flex; flex-direction: column; gap: 52px; }
    [data-composition-id="q-measurement"] .qm-panels .bk-panel { padding-top: 40px; }
    [data-composition-id="q-measurement"] .qm-panels p { font-size: 40px; line-height: 1.3; }
    [data-composition-id="q-measurement"] .qm-null { font-family: var(--font-mono); font-weight: 700; padding: 0 10px; border: 3px dashed var(--ink-2); border-radius: 8px; }
    [data-composition-id="q-measurement"] #qm-mascot { left: 320px; top: 680px; --h: 320px; }
    [data-composition-id="q-measurement"] #qm-stamp { position: absolute; left: 1390px; top: 300px; }
  </style>
  <div id="root" data-composition-id="q-measurement" data-hold data-width="1920" data-height="1080" data-window="8" data-fragments="1.4">
    <div class="bk-stage">
      <div class="bk-sheet"></div>
      <header class="bk-band">
        <span class="bk-folio">BELDESK / QUESTIONS</span>
        <span class="bk-section">Questions · 01 / measurement</span>
        <span class="bk-no">22 · Q1</span>
      </header>
      <div class="bk-rule"></div>
      <h2 class="bk-title">What did you measure, and how sure are you?</h2>

      <div class="bk-halftone qm-dots"></div>
      <div id="qm-card" class="bk-panel bk-panel--sun qm-hero">
        <div class="bk-bigfig"><span id="qm-inputs" class="bk-bigfig-n">25</span><span class="bk-bigfig-l">inputs</span></div>
        <span id="qm-x" class="qm-x">×</span>
        <div class="bk-bigfig"><span id="qm-temps" class="bk-bigfig-n">3</span><span class="bk-bigfig-l">temperatures</span></div>
      </div>

      <div class="qm-panels">
        <section id="qm-counted" class="bk-panel">
          <span class="bk-tab bk-tab--teal">Counted</span>
          <p>25 inputs × three temperatures; token counts, list-cost estimates and exact outputs. <span id="qm-seed" class="bk-scan">One fixed seed and one sample per temperature.</span></p>
        </section>
        <section id="qm-limits" class="bk-panel">
          <span class="bk-tab bk-tab--tomato">Limits</span>
          <p>Behavior coding is manual, <span id="qm-annot" class="bk-scan">single annotator</span>. Accuracy-type scoreboard fields remain <span class="qm-null">null</span>.</p>
        </section>
      </div>
      <div id="qm-mascot" class="bk-mascot bk-mascot--buyutec"><img class="bk-mascot-pose" src="assets/maskot/buyutec.png" alt=""></div>
    </div>
  </div>
  <script>
    BK.scene("q-measurement", function (tl, root, BK) {
      BK.frame(tl, root, 0);
      // Sarı kart çarpar, 25 sayarak gelir, × ve 3 pop eder
      BK.slam(tl, "#qm-card", 0.2, { duration: 0.42 });
      BK.fade(tl, ".qm-dots", 0.35, { duration: 0.3, to: 0.8 });
      BK.count(tl, "#qm-inputs", 25, 0.3, { duration: 0.7 });
      BK.formula(tl, ["#qm-x", "#qm-temps"], 0.55, { stagger: 0.1 });
      // Paneller çarpar, sınırlar fosforlu kalemle çizilir
      BK.slam(tl, ["#qm-counted", "#qm-limits"], 0.3, { stagger: 0.12, duration: 0.45 });
      BK.scan(tl, ["#qm-seed", "#qm-annot"], 0.75, { duration: 0.4, stagger: 0.06 });
      BK.mascotIn(tl, "#qm-mascot", 0.25, { from: "bottom" });
    });
  </script>
</template>
