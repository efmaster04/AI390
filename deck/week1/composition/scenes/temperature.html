<template id="temperature-template">
  <style>
    #root { position: absolute; inset: 0; }
    /* Sol üst: üç koşu tek ızgarada (kodlama çubukları + t0 ile birebir eşleşme + ortalama cevap uzunluğu) */
    [data-composition-id="temperature"] .tp-dots { left: 112px; top: 284px; width: 1080px; height: 476px; }

    [data-composition-id="temperature"] .tp-track { position: relative; height: 64px; border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; background: var(--paper); }
    [data-composition-id="temperature"] .tp-fill { position: absolute; inset: 0; display: flex; }
    [data-composition-id="temperature"] .tp-seg { display: flex; align-items: center; justify-content: center; height: 100%; border-right: 3px solid var(--ink);
      font-family: var(--font-mono); font-weight: 700; font-size: 34px; }
    [data-composition-id="temperature"] .tp-seg:last-child { border-right: 0; }
    [data-composition-id="temperature"] .tp-meets { background: var(--teal); }
    [data-composition-id="temperature"] .tp-partial { background: var(--sun); }

    [data-composition-id="temperature"] .tp-trk-wrap { position: relative; }
    [data-composition-id="temperature"] .tp-zero { position: absolute; left: 0; top: calc(100% + 2px); display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-weight: 700; font-size: 28px; line-height: 1.1; color: var(--teal-ink); white-space: nowrap; }

    [data-composition-id="temperature"] .tp-v { font-family: var(--font-display); font-weight: 900; font-size: 52px; line-height: 1; font-variant-numeric: tabular-nums lining-nums; white-space: nowrap; }
    [data-composition-id="temperature"] .tp-v small { font-size: 34px; color: var(--ink-2); }
    [data-composition-id="temperature"] .tp-c { font-family: var(--font-mono); font-weight: 700; font-size: 40px; white-space: nowrap; }
    [data-composition-id="temperature"] .tp-foot { margin-top: 40px; padding-top: 10px; border-top: 3px dashed var(--shadow); font-size: 28px; line-height: 1.25; color: var(--ink-2); font-weight: 700; }

    /* Sağ üst: W1-14 aynı İngilizce girdi, üç sıcaklık, üç farklı cevap dili */
    [data-composition-id="temperature"] .tp-lang { position: absolute; left: 1226px; top: 270px; width: 598px; height: 476px; padding: 40px 30px 22px; }
    [data-composition-id="temperature"] .tp-lang-in { font-size: 28px; font-family: var(--font-mono); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
    [data-composition-id="temperature"] .tp-row { display: grid; grid-template-columns: 100px 1fr; align-items: center; column-gap: 14px; row-gap: 2px; margin-top: 10px; padding-bottom: 8px; border-bottom: 3px dashed var(--shadow); }
    [data-composition-id="temperature"] #tp-r2 { border-bottom: 0; }
    [data-composition-id="temperature"] .tp-row .tp-t { font-size: 36px; }
    [data-composition-id="temperature"] .tp-say { font-size: 40px; line-height: 1.1; white-space: nowrap; }
    [data-composition-id="temperature"] .tp-q { grid-column: 2; font-family: var(--font-mono); font-weight: 400; font-size: 28px; line-height: 1.2; color: var(--ink-2); white-space: nowrap; }
    [data-composition-id="temperature"] .tp-chip { display: inline-block; margin-right: 12px; padding: 0 10px; border: 3px solid var(--ink); border-radius: 8px; font-family: var(--font-mono); font-weight: 700; font-size: 30px; vertical-align: 4px; background: var(--paper); }
    [data-composition-id="temperature"] #tp-stamp { position: absolute; right: 30px; bottom: 20px; font-size: 30px; }

    /* Alt: ne değişti, neden */
    [data-composition-id="temperature"] .tp-why { position: absolute; left: var(--edge-x); top: 770px; width: 1430px; padding: 10px 32px 12px 30px; font-family: var(--font-body); font-weight: 700; font-size: 40px; line-height: 1.26; }
    [data-composition-id="temperature"] .tp-why strong { display: block; font-family: var(--font-display); font-weight: 900; font-size: 46px; line-height: 1.1; margin-bottom: 4px; }
    [data-composition-id="temperature"] #temperature-mascot { --h: 280px; left: 1604px; top: 768px; }
  </style>
  <div id="root" data-composition-id="temperature" data-hold data-width="1920" data-height="1080" data-window="8" data-fragments="1.4,2.5,3.6,4.7">
    <div class="bk-stage">
      <div class="bk-sheet"></div>
      <header class="bk-band"><span class="bk-deliv"><span class="bk-deliv-id">W1.5</span>Baseline</span><span class="bk-section">W1.5 · t0 / t0.7 / t1.2</span><span class="bk-no">11 / 22</span></header>
      <div class="bk-rule"></div>
      <h2 class="bk-title">Temperature changed <span id="tp-key" class="bk-scan">wording and decisions</span></h2>

      <div class="bk-halftone tp-dots"></div>
      <section id="tp-board" class="bk-panel tp-board">
        <div class="tp-grid">
          <span class="tp-h">temp</span>
          <span class="tp-h tp-legend"><span><i class="tp-meets"></i>meets</span><span><i class="tp-partial"></i>partial</span><span><i class="tp-fails"></i>fails</span></span>
          <span id="tp-h-match" class="tp-h">exact match<br>to t0</span>
          <span id="tp-h-chars" class="tp-h">mean reply<br>chars</span>

          <span class="tp-t">t0</span>
          <div class="tp-track"><div class="tp-fill"><span class="tp-seg tp-meets" style="width:8%">2</span><span class="tp-seg tp-partial" style="width:12%">3</span><span class="tp-seg tp-fails" style="width:80%"><b>20</b></span></div></div>
          <span class="tp-v tp-m"><span id="tp-m0">25</span><small>/25</small></span>
          <span class="tp-c tp-ch">487.48</span>

          <span class="tp-t">t0.7</span>
          <div class="tp-track"><div class="tp-fill"><span class="tp-seg tp-meets" style="width:8%">2</span><span class="tp-seg tp-partial" style="width:12%">3</span><span class="tp-seg tp-fails" style="width:80%"><b>20</b></span></div></div>
          <span class="tp-v tp-m"><span id="tp-m1" class="bk-scan">1</span><small>/25</small></span>
          <span class="tp-c tp-ch">477.36</span>

          <span class="tp-t">t1.2</span>
          <div class="tp-trk-wrap"><div class="tp-track"><div class="tp-fill"><span class="tp-seg tp-partial" style="width:20%">5</span><span class="tp-seg tp-fails" style="width:80%"><b>20</b></span></div></div><span id="tp-zero" class="tp-zero"><i></i>0 meets</span></div>
          <span class="tp-v tp-m"><span id="tp-m2" class="bk-scan">1</span><small>/25</small></span>
          <span class="tp-c tp-ch">499.72</span>
        </div>
        <p id="tp-foot" class="tp-foot">n=25 · one sample per temperature (fixed seed)<br>manual single-annotator coding</p>
      </section>

      <section id="tp-lang" class="bk-panel tp-lang">
        <span class="bk-tab bk-tab--sun">W1-14 · same input</span>
        <span id="tp-stamp" class="bk-stamp bk-stamp--on-cream">language changed</span>
        <div class="tp-lang-in">Citizen wrote in English</div>
        <div id="tp-r0" class="tp-row"><span class="tp-t">t0</span><span class="tp-say">Turkish, then English</span><span class="tp-q">“Merhaba, Yeşilvadi …”</span></div>
        <div id="tp-r1" class="tp-row"><span class="tp-t">t0.7</span><span class="tp-say">Turkish only</span><span class="tp-q">“Merhaba, Yeşilvadi …”</span></div>
        <div id="tp-r2" class="tp-row"><span class="tp-t">t1.2</span><span class="tp-say">English only</span><span class="tp-q">“Hello. Thank you for …”</span></div>
      </section>

      <p id="tp-why" class="bk-callout tp-why"><strong>Same prompt, same seed; only temperature changed.</strong>It reshapes the next-token distribution, so facts, language and claimed actions shifted — and <span id="tp-w124" class="bk-scan bk-scan--tomato">W1-24 failed at every setting</span>.</p>

      <div class="bk-repo"><span class="bk-repo-k">repo</span>docs/baseline_analysis_week1.md</div>
      <div id="temperature-mascot" class="bk-mascot bk-mascot--aide bk-mascot--dusunen"><img class="bk-mascot-pose" src="assets/maskot/dusunen.png" alt=""></div>
    </div>
  </div>
  <script>
    BK.scene("temperature", function (tl, root, BK) {
      var $ = function (s) { return root.querySelectorAll(s); };
      // ---- Giriş (0 – 1.2): çerçeve, kodlama panosu, üç yığın çubuk + dipnot (dipnot çubuklarla aynı karede) ----
      BK.frame(tl, root, 0);
      BK.scan(tl, "#tp-key", 0.75, { duration: 0.4 });
      BK.fade(tl, ".tp-dots", 0.2, { duration: 0.3, to: 0.45 });
      BK.slam(tl, "#tp-board", 0.2, { duration: 0.45 });
      BK.bars(tl, $(".tp-fill"), 0.5, { stagger: 0.1, duration: 0.5 });
      BK.rise(tl, "#tp-foot", 0.85, { y: 10, duration: 0.3 });
      BK.rise(tl, "#tp-zero", 0.95, { y: 6, duration: 0.25 });
      BK.mascotIn(tl, "#temperature-mascot", 0.3, { from: "right" });

      // ---- Adım 1 (1.45 → 2.5): t0 ile birebir eşleşme sayar, ortalama cevap uzunluğu ----
      BK.rise(tl, ["#tp-h-match", "#tp-h-chars"], 1.45, { y: 10, duration: 0.3, stagger: 0.05 });
      BK.rise(tl, $(".tp-m"), 1.5, { y: 14, duration: 0.35, stagger: 0.08 });
      BK.count(tl, "#tp-m0", 25, 1.5, { duration: 0.55 });
      BK.rise(tl, $(".tp-ch"), 1.65, { y: 10, duration: 0.35, stagger: 0.08 });
      BK.scan(tl, ["#tp-m1", "#tp-m2"], 1.95, { duration: 0.3, stagger: 0.08 });
      BK.mascotReact(tl, "#temperature-mascot", 1.6, { kind: "hop" });

      // ---- Adım 2 (2.55 → 3.6): W1-14 aynı İngilizce girdi, cevap dili değişir ----
      BK.slam(tl, "#tp-lang", 2.55, { duration: 0.42 });
      BK.rise(tl, ["#tp-r0", "#tp-r1", "#tp-r2"], 2.75, { y: 12, duration: 0.3, stagger: 0.1 });
      BK.stamp(tl, "#tp-stamp", 3.1, { rotation: -3 });
      BK.mascotReact(tl, "#temperature-mascot", 3.05, { kind: "shake" });

      // ---- Adım 3 (3.65 → 4.7): ne değişti, neden ----
      BK.slam(tl, "#tp-why", 3.65, { duration: 0.42 });
      BK.scan(tl, "#tp-w124", 4.05, { duration: 0.4 });
      BK.mascotReact(tl, "#temperature-mascot", 3.7, { kind: "squash" });
    });
  </script>
</template>
