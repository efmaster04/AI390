<template id="tokens-template">
  <style>
    #root { position: absolute; inset: 0; }
    /* İki yarı: 12a (girdi) adım 1-4, 12b (çıktı + sıcaklık) adım 5-8 onun yerini alır (icerik.md §12 yedek planı) */
    [data-composition-id="tokens"] .tk-layer { position: absolute; inset: 0; }

    /* ===== 12a: bir isteğin girdi token'ları ===== */
    [data-composition-id="tokens"] .tk-req { position: absolute; left: var(--edge-x); top: 344px; width: 1110px; }
    [data-composition-id="tokens"] .tk-req-k { display: block; margin-bottom: 12px; }
    [data-composition-id="tokens"] .tk-bar-dots { left: 108px; top: 400px; width: 1110px; height: 124px; }
    [data-composition-id="tokens"] .tk-bar { position: relative; height: 124px; border: 4px solid var(--ink); border-radius: 16px; overflow: hidden; background: var(--paper); box-shadow: 7px 7px 0 var(--ink); }
    [data-composition-id="tokens"] .tk-bar-fill { position: absolute; inset: 0; display: flex; }
    [data-composition-id="tokens"] .tk-seg { display: flex; flex-direction: column; justify-content: center; padding: 0 26px; height: 100%; }
    [data-composition-id="tokens"] .tk-seg--sys { width: 63.8%; background: var(--teal-soft); border-right: 4px solid var(--ink); }
    [data-composition-id="tokens"] .tk-seg--msg { width: 36.2%; background: var(--sun-soft); box-shadow: inset 0 10px 0 var(--sun); }
    [data-composition-id="tokens"] .tk-seg-n { font-family: var(--font-display); font-weight: 900; font-size: 64px; line-height: 1; }
    [data-composition-id="tokens"] .tk-seg-l { font-family: var(--font-mono); font-weight: 700; font-size: 28px; letter-spacing: .04em; text-transform: uppercase; margin-top: 4px; }
    [data-composition-id="tokens"] .tk-sum { display: flex; justify-content: flex-end; align-items: baseline; gap: 14px; margin-top: 14px; padding-top: 10px; border-top: 4px solid var(--ink); }
    [data-composition-id="tokens"] .tk-sum-n { font-family: var(--font-display); font-weight: 900; font-size: 48px; line-height: 1; }
    [data-composition-id="tokens"] .tk-sum-l { font-family: var(--font-mono); font-weight: 700; font-size: 28px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
    [data-composition-id="tokens"] .tk-sum-out { display: inline-flex; align-items: baseline; gap: 14px; margin-left: 18px; padding-left: 22px; border-left: 3px dashed var(--shadow); }

    [data-composition-id="tokens"] .tk-demo { position: absolute; left: 1262px; top: 344px; width: 562px; padding: 40px 30px 24px; border-left: 16px solid var(--teal); }
    [data-composition-id="tokens"] .tk-demo p { font-size: 40px; line-height: 1.2; }
    [data-composition-id="tokens"] .tk-demo-cmd { display: block; margin-top: 14px; font-family: var(--font-mono); font-weight: 700; font-size: 34px; }
    [data-composition-id="tokens"] .tk-demo-cmd .bk-term-you { color: var(--ink-2); }

    [data-composition-id="tokens"] .tk-pair { position: absolute; left: var(--edge-x); top: 622px; width: 1404px; padding: 30px 32px 10px; }
    [data-composition-id="tokens"] .tk-prow { display: grid; grid-template-columns: 150px 900px 1fr; column-gap: 26px; align-items: center; }
    [data-composition-id="tokens"] .tk-prow + .tk-prow { margin-top: 6px; padding-top: 6px; border-top: 3px dashed var(--shadow); }
    [data-composition-id="tokens"] .tk-id { font-family: var(--font-mono); font-weight: 700; font-size: 34px; line-height: 1.2; }
    [data-composition-id="tokens"] .tk-chip { display: inline-block; margin-top: 4px; padding: 0 10px; border: 3px solid var(--ink); border-radius: 8px; font-size: 28px; background: var(--paper); }
    [data-composition-id="tokens"] .tk-msg { font-family: var(--font-mono); font-weight: 400; font-size: 34px; line-height: 1.25; }
    [data-composition-id="tokens"] .tk-res { display: flex; flex-direction: column; align-items: flex-end; }
    [data-composition-id="tokens"] .tk-res-n { font-family: var(--font-display); font-weight: 900; font-size: 54px; line-height: 1; white-space: nowrap; }
    [data-composition-id="tokens"] .tk-res-n small { font-family: var(--font-mono); font-size: 28px; font-weight: 700; margin-left: 8px; }
    [data-composition-id="tokens"] .tk-res-l { font-family: var(--font-mono); font-weight: 700; font-size: 28px; color: var(--ink-2); white-space: nowrap; }

    [data-composition-id="tokens"] .tk-avg { position: absolute; left: var(--edge-x); top: 890px; padding-top: 11px; padding-bottom: 11px; font-size: 40px; line-height: 1; white-space: nowrap; }

    /* ===== 12b: cevap tarafı ===== */
    [data-composition-id="tokens"] .tk-cpt { position: absolute; left: var(--edge-x); top: 290px; width: 920px; height: 340px; padding: 40px 34px 22px; }
    [data-composition-id="tokens"] .tk-cpt-h { font-family: var(--font-mono); font-weight: 700; font-size: 28px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
    [data-composition-id="tokens"] .tk-crow { display: grid; grid-template-columns: 76px 340px 1fr; column-gap: 24px; align-items: center; margin-top: 18px; }
    [data-composition-id="tokens"] .tk-lang { font-family: var(--font-mono); font-weight: 700; font-size: 40px; }
    [data-composition-id="tokens"] .tk-tile { justify-self: start; display: inline-flex; height: 78px; border: 4px solid var(--ink); border-radius: 12px; overflow: hidden; background: var(--paper); }
    [data-composition-id="tokens"] .tk-cell { width: 70px; height: 100%; border-right: 3px dashed var(--ink-2); }
    [data-composition-id="tokens"] .tk-cell:last-child { width: 42px; border-right: 0; background-image: repeating-linear-gradient(135deg, var(--shadow) 0 4px, transparent 4px 12px); }
    [data-composition-id="tokens"] .tk-tile--tr .tk-cell { background-color: var(--sun-soft); }
    [data-composition-id="tokens"] .tk-tile--en .tk-cell { background-color: var(--cream); }
    [data-composition-id="tokens"] .tk-cv { font-family: var(--font-display); font-weight: 900; font-size: 76px; line-height: 1; white-space: nowrap; }
    [data-composition-id="tokens"] .tk-cv small { font-family: var(--font-mono); font-size: 28px; font-weight: 700; color: var(--ink-2); margin-left: 6px; }
    [data-composition-id="tokens"] .tk-cpt-foot { margin-top: 18px; font-size: 28px; font-weight: 700; color: var(--ink-2); }

    [data-composition-id="tokens"] .tk-out { position: absolute; left: 1064px; top: 290px; width: 760px; height: 340px; padding: 40px 34px 22px; }
    [data-composition-id="tokens"] .tk-out-figs { display: flex; gap: 46px; align-items: flex-end; margin-top: 6px; }
    [data-composition-id="tokens"] .tk-out .bk-bigfig-n { font-size: 112px; }
    [data-composition-id="tokens"] .tk-out p { margin-top: 14px; font-size: 32px; line-height: 1.25; white-space: nowrap; }
    [data-composition-id="tokens"] #tk-noise { position: absolute; right: 34px; bottom: 24px; font-size: 30px; }

    [data-composition-id="tokens"] .tk-temp { position: absolute; left: var(--edge-x); top: 670px; width: 920px; padding: 40px 34px 24px; }
    [data-composition-id="tokens"] .tk-temp .bk-bars { gap: 12px; }
    [data-composition-id="tokens"] .tk-temp .bk-bar { --bar-label: 100px; --bar-val: 120px; }
    [data-composition-id="tokens"] .tk-temp .bk-bar-track { height: 46px; }
    [data-composition-id="tokens"] .tk-temp .bk-bar-val { font-size: 48px; text-align: right; }
    [data-composition-id="tokens"] .tk-temp .bk-bar-fill { background-color: var(--cream); background-image: var(--dots); background-size: 10px 10px; }
    [data-composition-id="tokens"] .tk-axis { position: relative; height: 36px; margin: 8px 142px 0 122px; font-family: var(--font-mono); font-weight: 700; font-size: 28px; color: var(--ink-2); }
    [data-composition-id="tokens"] .tk-axis .tk-axis-u { left: auto; right: -132px; translate: none; color: var(--ink); }
    [data-composition-id="tokens"] .tk-axis span { position: absolute; top: 0; translate: -50% 0; white-space: nowrap; }

    [data-composition-id="tokens"] .tk-foot { position: absolute; left: 1064px; top: 666px; width: 470px; padding: 26px 26px; font-size: 40px; line-height: 1.2; }
    [data-composition-id="tokens"] .tk-foot .bk-tape { left: 170px; top: -22px; }

    [data-composition-id="tokens"] #tokens-mascot { left: 1560px; top: 646px; }
  </style>
  <div id="root" data-composition-id="tokens" data-hold data-width="1920" data-height="1080" data-window="8" data-fragments="1.4,2.2,3,3.8,4.7,5.5,6.3,7.1">
    <div class="bk-stage">
      <div class="bk-sheet"></div>
      <header class="bk-band"><span class="bk-deliv"><span class="bk-deliv-id">W1.5</span>Tokens · TR vs EN</span><span class="bk-section">W1.5 / W1.6</span><span class="bk-no">12 / 22</span></header>
      <div class="bk-rule"></div>

      <!-- ===== 12a: girdi ===== -->
      <div id="tk-a" class="tk-layer" data-layout-allow-overlap>
        <h2 class="bk-title">Most input tokens are the <span id="tk-key-a" class="bk-scan">shared prompt</span>; the reply drives the count</h2>

        <div class="bk-halftone tk-bar-dots"></div>
        <div class="tk-req">
          <span id="tk-req-k" class="bk-label tk-req-k">One request · input tokens</span>
          <div id="tk-bar" class="tk-bar">
            <div class="tk-bar-fill">
              <div class="tk-seg tk-seg--sys"><span id="tk-n-sys" class="tk-seg-n">~60</span><span class="tk-seg-l">shared system prompt</span></div>
              <div class="tk-seg tk-seg--msg"><span id="tk-n-msg" class="tk-seg-n">~34</span><span class="tk-seg-l">citizen message</span></div>
            </div>
          </div>
          <div id="tk-sum" class="tk-sum"><span class="tk-sum-n">≈ 94</span><span class="tk-sum-l">input tokens (estimate)</span><span id="tk-sum-out" class="tk-sum-out"><span class="tk-sum-l">reply</span><span class="tk-sum-n">≈ 122</span><span class="tk-sum-l">output</span></span></div>
        </div>

        <section id="tk-demo" class="bk-panel tk-demo">
          <span class="bk-tab bk-tab--teal">Live demo</span>
          <p>A two-word message already costs <span id="tk-63" class="bk-scan">63</span></p>
          <span class="tk-demo-cmd"><span class="bk-term-you">you&gt;</span> Adım Doruk.<br>→ in=63</span>
        </section>

        <section id="tk-pair" class="bk-panel tk-pair">
          <span class="bk-tab bk-tab--sun">Same length · both status lookups</span>
          <div id="tk-p1" class="tk-prow">
            <span class="tk-id">W1-07<br><span class="tk-chip">TR</span></span>
            <span class="tk-msg"><span style="white-space:nowrap">YV-2026-004871</span> numaralı şikayetim ne durumda? Telefonumun son 4 hanesi 5839.</span>
            <span class="tk-res"><span class="tk-res-n"><span id="tk-c1">95</span><small>tokens</small></span><span class="tk-res-l">from 76 chars</span></span>
          </div>
          <div id="tk-p2" class="tk-prow">
            <span class="tk-id">W1-10<br><span class="tk-chip">EN</span></span>
            <span class="tk-msg">Can you check the status of ticket <span style="white-space:nowrap">YV-2026-011532?</span> Last 4 of my phone: 2274.</span>
            <span class="tk-res"><span class="tk-res-n"><span id="tk-c2">93</span><small>tokens</small></span><span class="tk-res-l">from 76 chars</span></span>
          </div>
        </section>

        <p id="tk-avg" class="bk-callout tk-avg">Input tokens on average, unmatched messages: TR <span id="tk-a-tr">93</span> · EN <span id="tk-a-en">94</span></p>
      </div>

      <!-- ===== 12b: çıktı ve sıcaklık (12a'nın yerini alır) ===== -->
      <div id="tk-b" class="tk-layer" data-layout-allow-overlap>
        <h2 id="tk-title-b" class="bk-title">Turkish replies use more tokens <span id="tk-key-b" class="bk-scan">per character</span></h2>

        <section id="tk-cpt" class="bk-panel tk-cpt">
          <span class="bk-tab bk-tab--sun">Replies · characters per token</span>
          <div class="tk-cpt-h">One token holds about …</div>
          <div class="tk-crow">
            <span class="tk-lang">TR</span>
            <span id="tk-tile-tr" class="tk-tile tk-tile--tr"><i class="tk-cell"></i><i class="tk-cell"></i><i class="tk-cell"></i><i class="tk-cell"></i></span>
            <span id="tk-v-tr" class="tk-cv">≈ 3.6<small>chars</small></span>
          </div>
          <div class="tk-crow">
            <span class="tk-lang">EN</span>
            <span id="tk-tile-en" class="tk-tile tk-tile--en"><i class="tk-cell"></i><i class="tk-cell"></i><i class="tk-cell"></i><i class="tk-cell"></i><i class="tk-cell"></i></span>
            <span id="tk-v-en" class="tk-cv">≈ 4.6<small>chars</small></span>
          </div>
          <p id="tk-cpt-foot" class="tk-cpt-foot">per character, not per meaning · same direction at t0, t0.7, t1.2</p>
        </section>

        <section id="tk-out" class="bk-panel tk-out">
          <span class="bk-tab">Output tokens per reply · t0</span>
          <span id="tk-noise" class="bk-stamp bk-stamp--muted bk-stamp--on-cream">within noise</span>
          <div class="tk-out-figs">
            <div class="bk-bigfig"><span id="tk-o-tr" class="bk-bigfig-n">133</span><span class="bk-bigfig-l">TR · n=13</span></div>
            <div class="bk-bigfig"><span id="tk-o-en" class="bk-bigfig-n">110</span><span class="bk-bigfig-l">EN · n=12</span></div>
          </div>
          <p id="tk-o-sub">EN 119 without the 10-token injected reply</p>
        </section>

        <section id="tk-temp" class="bk-panel tk-temp">
          <span class="bk-tab">Mean output tokens · nearly flat</span>
          <div class="bk-bars">
            <div class="bk-bar"><span class="bk-bar-label">t0</span><span class="bk-bar-track"><i class="bk-bar-fill" style="--w:81.3%"></i></span><span id="tk-t0" class="bk-bar-val">122</span></div>
            <div class="bk-bar"><span class="bk-bar-label">t0.7</span><span class="bk-bar-track"><i class="bk-bar-fill" style="--w:79.3%"></i></span><span id="tk-t1" class="bk-bar-val">119</span></div>
            <div class="bk-bar"><span class="bk-bar-label">t1.2</span><span class="bk-bar-track"><i class="bk-bar-fill" style="--w:82.7%"></i></span><span id="tk-t2" class="bk-bar-val">124</span></div>
          </div>
          <div id="tk-axis" class="tk-axis"><span style="left:0">0</span><span style="left:50%">75</span><span style="left:100%">150</span><span class="tk-axis-u">tokens</span></div>
        </section>

        <section id="tk-foot" class="bk-panel bk-panel--tilt-r tk-foot">
          <span class="bk-tape"></span>
          Unmatched TR/EN inputs; not a test of Turkish token inflation — <span id="tk-pf" class="bk-scan" style="white-space:nowrap">PF-01 → W2</span>
        </section>
      </div>

      <div class="bk-repo"><span class="bk-repo-k">repo</span>eval/results/week1/</div>
      <div id="tokens-mascot" class="bk-mascot bk-mascot--aide bk-mascot--buyutec"><img class="bk-mascot-pose" src="assets/maskot/buyutec.png" alt=""></div>
    </div>
  </div>
  <script>
    BK.scene("tokens", function (tl, root, BK) {
      // ---- Giriş (0 – 1.2): çerçeve + bir isteğin girdi çubuğu (~60 ortak prompt + ~34 mesaj) ----
      BK.frame(tl, root, 0);
      BK.scan(tl, "#tk-key-a", 0.8, { duration: 0.35 });
      BK.fade(tl, "#tk-b", 0, { from: 0, to: 0, duration: 0.01 });   // 12b kabı adım 5'e kadar gizli
      BK.rise(tl, "#tk-req-k", 0.3, { y: 10, duration: 0.3 });
      BK.fade(tl, ".tk-bar-dots", 0.3, { duration: 0.3, to: 0.45 });
      BK.slam(tl, "#tk-bar", 0.3, { duration: 0.42 });
      BK.bars(tl, "#tk-bar .tk-bar-fill", 0.45, { duration: 0.5 });
      BK.formula(tl, ["#tk-n-sys", "#tk-n-msg"], 0.7, { stagger: 0.1 });
      BK.rise(tl, "#tk-sum", 0.85, { y: 10, duration: 0.3 });
      BK.mascotIn(tl, "#tokens-mascot", 0.3, { from: "right" });

      // ---- Adım 2 (1.45 → 2.2): demo dayanağı, in=63 ----
      BK.slam(tl, "#tk-demo", 1.45, { duration: 0.42 });
      BK.scan(tl, "#tk-63", 1.75, { duration: 0.3 });
      BK.mascotReact(tl, "#tokens-mascot", 1.5, { kind: "hop" });

      // ---- Adım 3 (2.25 → 3.0): aynı uzunlukta TR / EN durum sorgusu ----
      BK.slam(tl, "#tk-pair", 2.25, { duration: 0.42 });
      BK.rise(tl, ["#tk-p1", "#tk-p2"], 2.4, { y: 12, duration: 0.3, stagger: 0.1 });
      BK.count(tl, "#tk-c1", 95, 2.45, { duration: 0.45 });
      BK.count(tl, "#tk-c2", 93, 2.5, { duration: 0.45 });
      BK.mascotReact(tl, "#tokens-mascot", 2.3, { kind: "squash" });

      // ---- Adım 4 (3.05 → 3.8): ortalamalar ----
      BK.slam(tl, "#tk-avg", 3.05, { duration: 0.4 });
      BK.count(tl, "#tk-a-tr", 93, 3.1, { duration: 0.5 });
      BK.count(tl, "#tk-a-en", 94, 3.1, { duration: 0.5 });
      BK.rise(tl, "#tk-sum-out", 3.2, { y: 8, duration: 0.3 });
      BK.mascotReact(tl, "#tokens-mascot", 3.1, { kind: "shake" });

      // ---- Adım 5 (3.85 → 4.7): 12a çekilir, 12b gelir: karakter / token ----
      BK.dim(tl, "#tk-a", 3.85, { to: 0 });
      BK.fade(tl, "#tk-b", 3.9, { duration: 0.1, later: true });
      BK.titleIn(tl, "#tk-title-b", 3.92);
      BK.scan(tl, "#tk-key-b", 4.25, { duration: 0.3 });
      BK.slam(tl, "#tk-cpt", 3.95, { duration: 0.42 });
      BK.bars(tl, ["#tk-tile-tr", "#tk-tile-en"], 4.1, { duration: 0.4, stagger: 0.06 });
      BK.formula(tl, ["#tk-v-tr", "#tk-v-en"], 4.15, { stagger: 0.08 });
      BK.rise(tl, "#tk-cpt-foot", 4.25, { y: 8, duration: 0.3 });
      BK.mascotReact(tl, "#tokens-mascot", 3.95, { kind: "hop" });

      // ---- Adım 6 (4.75 → 5.5): output token TR / EN, çekinceyle ----
      BK.slam(tl, "#tk-out", 4.75, { duration: 0.42 });
      BK.count(tl, "#tk-o-tr", 133, 4.85, { duration: 0.45 });
      BK.count(tl, "#tk-o-en", 110, 4.85, { duration: 0.45 });
      BK.rise(tl, "#tk-o-sub", 4.95, { y: 8, duration: 0.3 });
      BK.stamp(tl, "#tk-noise", 5.0, { rotation: -3 });
      BK.mascotReact(tl, "#tokens-mascot", 4.95, { kind: "squash" });

      // ---- Adım 7 (5.55 → 6.3): sıcaklığa göre ortalama output ----
      BK.slam(tl, "#tk-temp", 5.55, { duration: 0.4 });
      BK.bars(tl, "#tk-temp .bk-bar-fill", 5.65, { duration: 0.4, stagger: 0.06 });
      BK.count(tl, "#tk-t0", 122, 5.65, { duration: 0.45 });
      BK.count(tl, "#tk-t1", 119, 5.7, { duration: 0.45 });
      BK.count(tl, "#tk-t2", 124, 5.75, { duration: 0.4 });
      BK.rise(tl, "#tk-axis", 5.8, { y: 6, duration: 0.25 });
      BK.mascotReact(tl, "#tokens-mascot", 5.6, { kind: "hop" });

      // ---- Adım 8 (6.35 → 7.1): dipnot — Türkçe şişme testi değil ----
      BK.slam(tl, "#tk-foot", 6.35, { duration: 0.42 });
      BK.scan(tl, "#tk-pf", 6.65, { duration: 0.3 });
      BK.mascotReact(tl, "#tokens-mascot", 6.4, { kind: "squash" });
    });
  </script>
</template>
