  <script>
    BK.scene("failure-tools", function (tl, root, BK) {
      var $ = function (s) { return root.querySelectorAll(s); };
      // ---- Giriş (0 – 1.2): 32 / 75 sayar, 75 hücre çizilir (kırmızı = işlem iddiası), maskot ----
      BK.frame(tl, root, 0);
      BK.fade(tl, ".ft-halftone", 0.25, { duration: 0.3 });
      BK.rise(tl, ".ft-fig", 0.25, { y: 16, duration: 0.35 });
      BK.count(tl, "#ft-n", 32, 0.3, { duration: 0.85 });
      BK.rise(tl, "#ft-lab", 0.4, { y: 12, duration: 0.3 });
      BK.draw(tl, $(".ft-c"), 0.45, { axis: "y", duration: 0.16, stagger: 0.006 });
      BK.fade(tl, $(".ft-rt, .ft-rn"), 0.5, { duration: 0.25, stagger: 0.05 });
      BK.note(tl, "#ft-foot", 0.85);
      BK.mascotIn(tl, "#failure-tools-mascot", 0.3, { from: "right" });
      BK.scan(tl, "#ft-hl", 0.9, { duration: 0.3 });

      // ---- Adım 2 (1.45 → 2.5): iki alıntı, iddia satırları taranır, damga ----
      BK.slam(tl, ["#ft-q1", "#ft-q2"], 1.45, { stagger: 0.14, duration: 0.4 });
      BK.scan(tl, ["#ft-m1", "#ft-m2"], 1.85, { duration: 0.35, stagger: 0.12 });
      BK.stamp(tl, "#ft-st", 2.05, { rotation: -3 });
      BK.mascotReact(tl, "#failure-tools-mascot", 2.1, { kind: "shake" });

      // ---- Adım 3 (2.55 → 3.6): kök neden + düzeltme ----
      BK.slam(tl, ["#ft-root", "#ft-fix"], 2.55, { stagger: 0.12, duration: 0.4 });
      BK.scan(tl, "#ft-root-hl", 3.0, { duration: 0.35 });
      BK.mascotReact(tl, "#failure-tools-mascot", 3.05, { kind: "hop" });
    });
  </script>
