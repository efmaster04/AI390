<template id="q-failure-template">
  <style>
    #root { position: absolute; inset: 0; }
    [data-composition-id="q-failure"] .qf-table { position: absolute; left: var(--edge-x); top: 316px; width: 1420px; }
    [data-composition-id="q-failure"] .qf-row { display: grid; grid-template-columns: 860px 130px 1fr; align-items: center; }
    [data-composition-id="q-failure"] .qf-head { margin-bottom: 14px; }
    [data-composition-id="q-failure"] .qf-row + .qf-row { margin-top: 30px; }
    [data-composition-id="q-failure"] .qf-obs { min-height: 112px; display: flex; align-items: center; padding: 18px 28px; font-size: 40px; line-height: 1.2; }
    [data-composition-id="q-failure"] .qf-obs { border-left: 16px solid var(--tomato); }
    [data-composition-id="q-failure"] .qf-miss { border-left: 16px solid var(--teal); color: var(--teal-ink); }
    [data-composition-id="q-failure"] .qf-id { font-family: var(--font-mono); font-weight: 700; color: var(--tomato-ink); margin-right: 14px; }
    [data-composition-id="q-failure"] .qf-link { display: flex; align-items: center; justify-content: center; color: var(--ink); }
    [data-composition-id="q-failure"] .qf-link .bk-arrow { width: 84px; margin: 0; }
    [data-composition-id="q-failure"] .qf-miss { display: flex; align-items: center; min-height: 112px; padding: 14px 28px; font-family: var(--font-display); font-weight: 900; font-size: 52px; line-height: 1; }
    [data-composition-id="q-failure"] .qf-callout { position: absolute; left: var(--edge-x); top: 866px; max-width: 1420px; font-size: 44px; }
    [data-composition-id="q-failure"] #qf-mascot { left: 1580px; top: 560px; --h: 330px; }
  </style>
  <div id="root" data-composition-id="q-failure" data-hold data-width="1920" data-height="1080" data-window="8" data-fragments="1.4">
    <div class="bk-stage">
      <div class="bk-sheet"></div>
      <header class="bk-band">
        <span class="bk-folio">BELDESK / QUESTIONS</span>
        <span class="bk-section">Questions · 02 / failure</span>
        <span class="bk-no">22 · Q2</span>
      </header>
      <div class="bk-rule"></div>
      <h2 class="bk-title">What failed, and do you know why?</h2>

      <div class="qf-table">
        <div class="qf-row qf-head">
          <span id="qf-h-obs" class="bk-label t-red">Observed failure</span><span></span>
          <span id="qf-h-miss" class="bk-label t-teal">Missing</span>
        </div>
        <div class="qf-row">
          <div class="bk-panel qf-obs"><span><span class="qf-id">W1-24</span>obeyed a <span id="qf-override" class="bk-scan bk-scan--full bk-scan--sun">fake admin override</span></span></div>
          <div class="qf-link"><span class="bk-arrow"></span></div>
          <div class="bk-panel qf-miss">Trust boundaries</div>
        </div>
        <div class="qf-row">
          <div class="bk-panel qf-obs"><span>Claimed checks or writes without tools</span></div>
          <div class="qf-link"><span class="bk-arrow"></span></div>
          <div class="bk-panel qf-miss">Tools</div>
        </div>
        <div class="qf-row">
          <div class="bk-panel qf-obs"><span>Stated uncited local facts</span></div>
          <div class="qf-link"><span class="bk-arrow"></span></div>
          <div class="bk-panel qf-miss">Grounding</div>
        </div>
      </div>

      <p id="qf-callout" class="bk-callout qf-callout">Missing trust boundaries, tools and grounding explain the observable failure paths.</p>
      <div id="qf-mascot" class="bk-mascot bk-mascot--dusunen"><img class="bk-mascot-pose" src="assets/maskot/dusunen.png" alt=""></div>
    </div>
  </div>
  <script>
    BK.scene("q-failure", function (tl, root, BK) {
      var $ = function (s) { return root.querySelectorAll(s); };
      BK.frame(tl, root, 0);
      BK.rise(tl, ["#qf-h-obs", "#qf-h-miss"], 0.2, { y: 10, duration: 0.35, stagger: 0.05 });
      // Hata kartı çarpar, ok çizilir, eksik parça kartı oturur (satır satır)
      BK.slam(tl, $(".qf-obs"), 0.25, { stagger: 0.1, duration: 0.4 });
      BK.draw(tl, $(".qf-link .bk-arrow"), 0.5, { duration: 0.3, stagger: 0.1 });
      BK.slam(tl, $(".qf-miss"), 0.55, { stagger: 0.1, duration: 0.4 });
      BK.scan(tl, "#qf-override", 0.6, { duration: 0.4 });
      BK.slam(tl, "#qf-callout", 0.7, { duration: 0.4 });
      BK.mascotIn(tl, "#qf-mascot", 0.25, { from: "right" });
    });
  </script>
</template>
