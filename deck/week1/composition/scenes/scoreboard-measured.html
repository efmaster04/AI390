<template id="scoreboard-measured-template">
  <style>
    #root { position: absolute; inset: 0; }
    /* Ölçülen 4 satır: sabit skor tablosunun dolu hücreleri, büyük kartlarda. Satır sırası kaynaktaki tabloyla aynı. */
    [data-composition-id="scoreboard-measured"] .sm-row {
      position: absolute; left: var(--edge-x); width: 1404px; height: 210px; display: grid; column-gap: 34px;
    }
    [data-composition-id="scoreboard-measured"] .sm-row--a { top: 306px; grid-template-columns: 500px 870px; }
    [data-composition-id="scoreboard-measured"] .sm-row--b { top: 566px; grid-template-columns: 685px 685px; }
    [data-composition-id="scoreboard-measured"] .sm-card { display: flex; flex-direction: column; justify-content: flex-end; padding: 30px 36px 26px; }
    [data-composition-id="scoreboard-measured"] .sm-card .bk-tab { text-transform: none; letter-spacing: 0; }
    [data-composition-id="scoreboard-measured"] .sm-week {
      position: absolute; right: 26px; top: 26px; padding: 2px 14px; border: 3px solid var(--ink); border-radius: 10px;
      background: var(--teal-soft); font-family: var(--font-mono); font-weight: 700; font-size: 28px;
    }
    [data-composition-id="scoreboard-measured"] .sm-val {
      font-family: var(--font-display); font-weight: 900; font-size: 104px; line-height: .9; letter-spacing: -.01em;
      font-variant-numeric: tabular-nums lining-nums; white-space: nowrap;
    }
    [data-composition-id="scoreboard-measured"] #sm-c2 .sm-val { font-size: 88px; }
    [data-composition-id="scoreboard-measured"] .sm-q { margin-top: 12px; font-size: 34px; line-height: 1.2; color: var(--ink-2); white-space: nowrap; }
    [data-composition-id="scoreboard-measured"] .sm-q b { color: var(--ink); font-weight: 800; }
    /* Dipnot: kaynak sunumdaki iki satır, harfiyen */
    [data-composition-id="scoreboard-measured"] #sm-foot {
      position: absolute; left: var(--edge-x); top: 820px; width: 1404px; padding: 18px 32px 18px 28px;
      border-left: 16px solid var(--sun); box-shadow: 5px 5px 0 var(--ink);
    }
    [data-composition-id="scoreboard-measured"] #sm-foot p { font-size: 36px; line-height: 1.3; white-space: nowrap; }
    /* 4 / 13: sonraki slaydın köprüsü */
    [data-composition-id="scoreboard-measured"] #sm-tally { position: absolute; left: 1530px; top: 306px; width: 294px; padding: 34px 26px 24px; }
    [data-composition-id="scoreboard-measured"] .sm-tally-n { display: flex; align-items: baseline; gap: 10px; font-family: var(--font-display); font-weight: 900; line-height: .9; }
    [data-composition-id="scoreboard-measured"] #sm-four { font-size: 150px; color: var(--teal-ink); }
    [data-composition-id="scoreboard-measured"] .sm-of { font-size: 64px; }
    [data-composition-id="scoreboard-measured"] .sm-tally-l { display: block; margin-top: 12px; }
    [data-composition-id="scoreboard-measured"] #scoreboard-measured-mascot { left: 1522px; top: 650px; --h: 300px; }
  </style>
  <div id="root" data-composition-id="scoreboard-measured" data-hold data-width="1920" data-height="1080" data-window="8" data-fragments="1.4,2.5">
    <div class="bk-stage">
      <div class="bk-sheet"></div>
      <header class="bk-band"><span class="bk-folio">BELDESK / SCOREBOARD</span><span class="bk-section">Scoreboard</span><span class="bk-no">19 / 22</span></header>
      <div class="bk-rule"></div>
      <h2 class="bk-title">Week 1 records <span id="sm-key" class="bk-scan">cost and scope</span>, not accuracy</h2>

      <div class="sm-row sm-row--a">
        <article id="sm-c1" class="bk-panel sm-card">
          <span class="bk-tab bk-tab--teal">test_set_size</span><span class="sm-week">W1</span>
          <div class="sm-val"><span id="sm-25">25</span></div>
          <div class="sm-q">inputs</div>
        </article>
        <article id="sm-c2" class="bk-panel sm-card">
          <span class="bk-tab bk-tab--teal">cost_per_task_usd</span><span class="sm-week">W1</span>
          <div class="sm-val">$0.00020593</div>
          <div class="sm-q"><b>list price</b> · t0</div>
        </article>
      </div>
      <div class="sm-row sm-row--b">
        <article id="sm-c3" class="bk-panel sm-card">
          <span class="bk-tab bk-tab--teal">spend_week_usd</span><span class="sm-week">W1</span>
          <div class="sm-val">$0</div>
          <div class="sm-q"><b>free-tier assumption</b></div>
        </article>
        <article id="sm-c4" class="bk-panel sm-card">
          <span class="bk-tab bk-tab--teal">spend_total_usd</span><span class="sm-week">W1</span>
          <div class="sm-val">$0</div>
          <div class="sm-q"><b>free-tier assumption</b></div>
        </article>
      </div>

      <section id="sm-tally" class="bk-panel bk-panel--sun">
        <div class="sm-tally-n"><span id="sm-four">4</span><span class="sm-of">/ 13</span></div>
        <span class="bk-label sm-tally-l">scoreboard rows filled</span>
      </section>

      <div id="sm-foot" class="bk-panel bk-panel--flat">
        <p>Accuracy-type metrics are null until measured (<span id="sm-never" class="bk-scan">never estimated</span>).</p>
        <p>Cost: list price · actual spend $0 (free tier, assumed)</p>
      </div>

      <div class="bk-repo"><span class="bk-repo-k">repo</span>reports/week-1.md</div>
      <div id="scoreboard-measured-mascot" class="bk-mascot bk-mascot--aide bk-mascot--isaret"><img class="bk-mascot-pose" src="assets/maskot/isaret.png" alt=""></div>
    </div>
  </div>
  <script>
    BK.scene("scoreboard-measured", function (tl, root, BK) {
      var P = BK.plan([1.1]);   // bekleme: 1.4 (kartlar), 2.5 (dipnot)
      BK.frame(tl, root, 0);
      BK.scan(tl, "#sm-key", 0.75, { duration: 0.4 });
      // Adım 0: dört kart sırayla oturur, 25 sayar
      BK.slam(tl, ["#sm-c1", "#sm-c2", "#sm-c3", "#sm-c4"], 0.3, { stagger: 0.1, duration: 0.45 });
      BK.count(tl, "#sm-25", 25, 0.4, { duration: 0.6 });
      BK.mascotIn(tl, "#scoreboard-measured-mascot", 0.25, { from: "right" });
      // 4/13 sayacı girişte gelir (ilk bekleme karesinde sağ üst boş kalmasın)
      BK.slam(tl, "#sm-tally", 0.55, { duration: 0.42 });
      BK.count(tl, "#sm-four", 4, 0.65, { duration: 0.45 });
      // Adım 1: dipnot; "never estimated" kalemle çizilir; maskot eğilir
      BK.slam(tl, "#sm-foot", P.at[1], { duration: 0.42 });
      BK.scan(tl, "#sm-never", P.at[1] + 0.45, { duration: 0.35 });
      BK.mascotReact(tl, "#scoreboard-measured-mascot", P.at[1] + 0.1, { kind: "tilt", angle: -3 });
    });
  </script>
</template>
