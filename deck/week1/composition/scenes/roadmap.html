<template id="roadmap-template">
  <style>
    #root { position: absolute; inset: 0; }
    /* Başlık maskota yer bırakır (maskot sağ üst köşede, x >= 1592) */
    [data-composition-id="roadmap"] .bk-title { right: 360px; }

    /* Üst şerit: sayaç (adım 1) + repo bağlantısı (adım 2) */
    [data-composition-id="roadmap"] .rm-tally {
      position: absolute; left: var(--edge-x); top: 272px; height: 110px; width: 600px;
      display: flex; align-items: center; gap: 18px; padding: 0 28px;
      background: var(--cream); border: 3px solid var(--ink); border-left: 16px solid var(--teal); border-radius: 14px; box-shadow: 5px 5px 0 var(--ink);
    }
    [data-composition-id="roadmap"] .rm-tally-n { font-family: var(--font-display); font-weight: 900; font-size: 96px; line-height: 1; color: var(--teal-ink); min-width: 56px; text-align: right; }
    [data-composition-id="roadmap"] .rm-tally-of { font-family: var(--font-display); font-weight: 900; font-size: 56px; line-height: 1; }
    [data-composition-id="roadmap"] .rm-tally-sep { width: 0; height: 64px; border-left: 3px dashed var(--ink); opacity: .5; margin: 0 6px; }
    [data-composition-id="roadmap"] .rm-tally-p { font-family: var(--font-display); font-weight: 900; font-size: 56px; line-height: 1; }
    [data-composition-id="roadmap"] .rm-link {
      position: absolute; left: 740px; top: 272px; height: 110px; width: 820px;
      display: flex; align-items: center; gap: 22px; padding: 0 30px;
    }
    [data-composition-id="roadmap"] .rm-link-url { font-family: var(--font-mono); font-weight: 700; font-size: 40px; white-space: nowrap; }

    /* Klasör: dersin tablosu → repo yolları (2 sütun × 4 satır) */
    [data-composition-id="roadmap"] .rm-shade { left: 110px; top: 448px; width: 1728px; height: 536px; }
    [data-composition-id="roadmap"] .rm-folder {
      position: absolute; left: var(--edge-x); top: 436px; width: 1728px; height: 536px; padding: 30px 36px 16px;
      display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, 1fr); grid-auto-flow: column; column-gap: 64px;
    }
    [data-composition-id="roadmap"] .rm-folder .bk-tab { left: 30px; }
    [data-composition-id="roadmap"] .rm-row { border-bottom: 3px dashed rgba(22,19,16,.28); padding: 0 4px; }
    [data-composition-id="roadmap"] #roadmap-r4, [data-composition-id="roadmap"] #roadmap-r8 { border-bottom: 0; }
    [data-composition-id="roadmap"] .rm-id { font-family: var(--font-display); font-weight: 900; margin-right: 12px; }
    [data-composition-id="roadmap"] .rm-name { font-weight: 800; }
    [data-composition-id="roadmap"] .rm-row .bk-check-path { margin-top: 2px; }
    [data-composition-id="roadmap"] .rm-row .bk-stamp { font-size: 32px; padding: 6px 18px; }
    [data-composition-id="roadmap"] .rm-row .rm-pend { font-size: 28px; white-space: normal; text-align: center; line-height: 1.08; padding: 8px 16px; }
    [data-composition-id="roadmap"] .rm-dash { position: absolute; left: 11px; top: 21px; width: 26px; height: 7px; border-radius: 4px; background: var(--ink-2); }

    [data-composition-id="roadmap"] #roadmap-mascot { left: 1592px; top: 148px; --h: 262px; }
  </style>
  <div id="root" data-composition-id="roadmap" data-hold data-width="1920" data-height="1080" data-window="8" data-fragments="1.4,2.5,3.6">
    <div class="bk-stage">
      <div class="bk-sheet"></div>
      <header class="bk-band">
        <span class="bk-folio">BELDESK / MAP</span>
        <span class="bk-section">Week 1 map</span>
        <span class="bk-no">02 / 22</span>
      </header>
      <div class="bk-rule"></div>
      <h2 class="bk-title">Eight deliverables, all in <span id="roadmap-hl" class="bk-scan">one repository</span></h2>

      <!-- adım 1: sayaç -->
      <div id="roadmap-tally" class="rm-tally">
        <span id="roadmap-done" class="rm-tally-n">6</span>
        <span class="rm-tally-of">/ 8</span>
        <span class="bk-label">done</span>
        <span class="rm-tally-sep"></span>
        <span class="rm-tally-p">2</span>
        <span class="bk-label">pending</span>
      </div>

      <!-- adım 2: repo bağlantısı -->
      <div id="roadmap-link" class="bk-panel rm-link">
        <span class="bk-label t-teal">repo</span>
        <span id="roadmap-url" class="rm-link-url bk-scan">github.com/efmaster04/AI390</span>
      </div>

      <div class="bk-halftone rm-shade"></div>
      <div id="roadmap-folder" class="bk-panel rm-folder">
        <span class="bk-tab bk-tab--sun">Course table → repo path</span>

        <div id="roadmap-r1" class="bk-check rm-row">
          <span class="bk-check-box"><span class="rm-dash"></span></span>
          <span class="bk-check-text"><span class="rm-id">W1.1</span><span class="rm-name">Team agreement</span><span class="bk-check-path">docs/team_agreement.md</span></span>
          <span class="bk-stamp bk-stamp--ink bk-stamp--on-cream rm-pend">Signatures<br>pending</span>
        </div>
        <div id="roadmap-r2" class="bk-check rm-row">
          <span class="bk-check-box"><span class="bk-check-tick"></span></span>
          <span class="bk-check-text"><span class="rm-id">W1.2</span><span class="rm-name">Use case brief</span><span class="bk-check-path">docs/use_case_brief.md</span></span>
          <span class="bk-stamp bk-stamp--teal bk-stamp--on-cream rm-ok">Done</span>
        </div>
        <div id="roadmap-r3" class="bk-check rm-row">
          <span class="bk-check-box"><span class="bk-check-tick"></span></span>
          <span class="bk-check-text"><span class="rm-id">W1.3</span><span class="rm-name">25 user inputs</span><span class="bk-check-path">eval/testsets/week1_inputs.jsonl</span></span>
          <span class="bk-stamp bk-stamp--teal bk-stamp--on-cream rm-ok">Done</span>
        </div>
        <div id="roadmap-r4" class="bk-check rm-row">
          <span class="bk-check-box"><span class="bk-check-tick"></span></span>
          <span class="bk-check-text"><span class="rm-id">W1.4</span><span class="rm-name">Data inventory</span><span class="bk-check-path">docs/data_inventory.md</span></span>
          <span class="bk-stamp bk-stamp--teal bk-stamp--on-cream rm-ok">Done</span>
        </div>
        <div id="roadmap-r5" class="bk-check rm-row">
          <span class="bk-check-box"><span class="bk-check-tick"></span></span>
          <span class="bk-check-text"><span class="rm-id">W1.5</span><span class="rm-name">Baseline</span><span class="bk-check-path">eval/results/week1/</span></span>
          <span class="bk-stamp bk-stamp--teal bk-stamp--on-cream rm-ok">Done</span>
        </div>
        <div id="roadmap-r6" class="bk-check rm-row">
          <span class="bk-check-box"><span class="bk-check-tick"></span></span>
          <span class="bk-check-text"><span class="rm-id">W1.6</span><span class="rm-name">Cost estimate</span><span class="bk-check-path">scripts/cost_estimate.py</span></span>
          <span class="bk-stamp bk-stamp--teal bk-stamp--on-cream rm-ok">Done</span>
        </div>
        <div id="roadmap-r7" class="bk-check rm-row">
          <span class="bk-check-box"><span class="bk-check-tick"></span></span>
          <span class="bk-check-text"><span class="rm-id">W1.7</span><span class="rm-name">Predicted failures</span><span class="bk-check-path">docs/predicted_failures.md</span></span>
          <span class="bk-stamp bk-stamp--teal bk-stamp--on-cream rm-ok">Done</span>
        </div>
        <div id="roadmap-r8" class="bk-check rm-row">
          <span class="bk-check-box"><span class="rm-dash"></span></span>
          <span class="bk-check-text"><span class="rm-id">W1.8</span><span class="rm-name">Repository</span><span class="bk-check-path">README.md</span></span>
          <span class="bk-stamp bk-stamp--ink bk-stamp--on-cream rm-pend">Tag<br>pending</span>
        </div>
      </div>

      <div id="roadmap-mascot" class="bk-mascot bk-mascot--aide bk-mascot--gorevli"><img class="bk-mascot-pose" src="assets/maskot/gorevli.png" alt=""></div>
    </div>
  </div>
  <script>
    BK.scene("roadmap", function (tl, root, BK) {
      var $ = function (s) { return root.querySelectorAll(s); };
      // Giriş (→ 1.4): çerçeve, klasör ve sekiz satır; kutular boş
      BK.frame(tl, root, 0);
      BK.slam(tl, "#roadmap-folder", 0.3, { duration: 0.45 });
      BK.fade(tl, ".rm-shade", 0.4, { duration: 0.3 });
      BK.rise(tl, $(".rm-row"), 0.5, { y: 12, duration: 0.4, stagger: 0.05 });
      BK.mascotIn(tl, "#roadmap-mascot", 0.25, { from: "right" });

      // Adım 1 (1.45 → 2.5): tikler + damgalar sırayla; sayaç 0 → 6
      var t1 = 1.45;
      tl.fromTo($(".rm-row .bk-check-tick"), { scaleY: 0, opacity: 0, transformOrigin: "50% 100%" },
        { scaleY: 1, opacity: 1, duration: 0.22, stagger: 0.05, ease: "power3.out" }, t1 + 0.1);
      BK.draw(tl, $(".rm-dash"), t1 + 0.1, { duration: 0.25 });
      BK.stamp(tl, $(".rm-ok"), t1 + 0.2, { rotation: -3, stagger: 0.05 });
      BK.stamp(tl, $(".rm-pend"), t1 + 0.42, { rotation: 2, stagger: 0.08 });
      BK.slam(tl, "#roadmap-tally", t1, { duration: 0.4 });
      BK.count(tl, "#roadmap-done", 6, t1 + 0.15, { duration: 0.6 });
      BK.mascotReact(tl, "#roadmap-mascot", t1 + 0.45, { kind: "hop" });

      // Adım 2 (2.55 → 3.6): tek repo vurgusu: bağlantı çarpar, başlıkta ve URL'de fosfor
      var t2 = 2.55;
      BK.slam(tl, "#roadmap-link", t2, { duration: 0.42 });
      BK.scan(tl, "#roadmap-url", t2 + 0.3, { duration: 0.45 });
      BK.scan(tl, "#roadmap-hl", t2 + 0.15, { duration: 0.45 });
      BK.mascotReact(tl, "#roadmap-mascot", t2 + 0.2, { kind: "tilt", angle: -4 });
    });
  </script>
</template>
