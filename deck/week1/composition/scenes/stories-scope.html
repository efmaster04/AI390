<template id="stories-scope-template">
  <style>
    #root { position: absolute; inset: 0; }
    /* Satır A: beş kullanıcı hikâyesi kartı (tam genişlik). Satır B: IN paneli (teal kenar) + OUT paneli (kırmızı kenar) + maskot. */
    [data-composition-id="stories-scope"] .ss-grid {
      position: absolute; left: var(--edge-x); top: 318px; width: 1728px; height: 222px;
      display: grid; grid-template-columns: 1.14fr 1fr 1fr 1fr 1fr; column-gap: 20px;
    }
    [data-composition-id="stories-scope"] .ss-card { display: flex; flex-direction: column; padding: 40px 16px 20px 22px; }
    [data-composition-id="stories-scope"] .ss-card h3 { font-family: var(--font-display); font-weight: 900; font-size: 44px; line-height: 1.02; white-space: nowrap; }
    [data-composition-id="stories-scope"] .ss-card p { margin-top: 12px; font-size: 40px; line-height: 1.12; }
    [data-composition-id="stories-scope"] .ss-card .ss-fig { font-family: var(--font-mono); font-weight: 700; font-size: 40px; white-space: nowrap; }
    [data-composition-id="stories-scope"] .ss-nw { white-space: nowrap; }
    [data-composition-id="stories-scope"] .ss-card .ss-fig .bk-arrow { width: 34px; margin: 0 10px; }

    [data-composition-id="stories-scope"] .ss-box { position: absolute; top: 604px; height: 336px; padding: 46px 36px 24px 30px; }
    [data-composition-id="stories-scope"] #ss-in { left: var(--edge-x); width: 920px; padding-right: 24px; border-left: 16px solid var(--teal); }
    [data-composition-id="stories-scope"] #ss-out { left: 1056px; width: 510px; border-left: 16px solid var(--tomato); }
    [data-composition-id="stories-scope"] .ss-dots { left: 116px; top: 624px; width: 920px; height: 336px; }
    [data-composition-id="stories-scope"] .ss-row { display: grid; align-items: baseline; column-gap: 20px; }
    [data-composition-id="stories-scope"] #ss-in .ss-row { grid-template-columns: 186px 1fr; }
    [data-composition-id="stories-scope"] #ss-in .ss-row + .ss-row { margin-top: 26px; }
    [data-composition-id="stories-scope"] .ss-verb { font-family: var(--font-display); font-weight: 900; font-size: 46px; line-height: 1.1; color: var(--teal-ink); }
    [data-composition-id="stories-scope"] .ss-txt { font-size: 40px; line-height: 1.2; }
    [data-composition-id="stories-scope"] #ss-out .ss-row { grid-template-columns: 34px 1fr; column-gap: 16px; }
    [data-composition-id="stories-scope"] #ss-out .ss-row + .ss-row { margin-top: 6px; }
    [data-composition-id="stories-scope"] .ss-x { font-family: var(--font-mono); font-weight: 700; font-size: 40px; line-height: 1.2; color: var(--tomato-ink); }
    [data-composition-id="stories-scope"] #stories-scope-mascot { left: 1586px; top: 636px; }
  </style>
  <div id="root" data-composition-id="stories-scope" data-hold data-width="1920" data-height="1080" data-window="8" data-fragments="1.4,2.5,3.6">
    <div class="bk-stage">
      <div class="bk-sheet"></div>
      <header class="bk-band"><span class="bk-deliv"><span class="bk-deliv-id">W1.2</span>Use case brief</span><span class="bk-section">W1.2</span><span class="bk-no">05 / 22</span></header>
      <div class="bk-rule"></div>
      <h2 class="bk-title">One desk handles questions and <span id="ss-hl" class="bk-scan">field problems</span></h2>

      <!-- 1. Beş kullanıcı hikâyesi -->
      <div class="ss-grid">
        <article class="bk-panel ss-card"><span class="bk-tab bk-tab--sun">US-1</span><h3>FAQ</h3><p>cited, or <span class="ss-nw">“cannot answer”</span></p></article>
        <article class="bk-panel ss-card"><span class="bk-tab bk-tab--sun">US-2</span><h3>Complaint</h3><p>confirm, then ticket</p></article>
        <article class="bk-panel ss-card"><span class="bk-tab bk-tab--sun">US-3</span><h3>Status</h3><p>ticket ID +<br>last 4 digits</p></article>
        <article class="bk-panel ss-card"><span class="bk-tab bk-tab--sun">US-4</span><h3>Staff queue</h3><p>by urgency,<br><span class="ss-fig">P1<span class="bk-arrow"></span>P4</span></p></article>
        <article class="bk-panel ss-card"><span class="bk-tab bk-tab--sun">US-5</span><h3>Emergency</h3><p><span class="ss-fig">112/110/155</span><br>first</p></article>
      </div>

      <!-- 2. Kapsam içi -->
      <div class="bk-halftone ss-dots"></div>
      <section id="ss-in" class="bk-panel ss-box">
        <span class="bk-tab bk-tab--teal">In scope</span>
        <div class="ss-row"><span class="ss-verb">Answer</span><span class="ss-txt">TR/EN, grounded in documents</span></div>
        <div class="ss-row"><span class="ss-verb">Ticket</span><span class="ss-txt">field problems only,<br>after confirmation</span></div>
        <div class="ss-row"><span class="ss-verb">Inform</span><span class="ss-txt">about applications; never submit</span></div>
      </section>

      <!-- 3. Kapsam dışı -->
      <section id="ss-out" class="bk-panel ss-box">
        <span class="bk-tab bk-tab--tomato">Out of scope</span>
        <div class="ss-row"><span class="ss-x">×</span><span class="ss-txt">Applications</span></div>
        <div class="ss-row"><span class="ss-x">×</span><span class="ss-txt">Payments</span></div>
        <div class="ss-row"><span class="ss-x">×</span><span class="ss-txt">Legal advice</span></div>
        <div class="ss-row"><span class="ss-x">×</span><span class="ss-txt">Real emergency<br>dispatch</span></div>
      </section>

      <div class="bk-repo"><span class="bk-repo-k">repo</span>docs/use_case_brief.md</div>
      <div id="stories-scope-mascot" class="bk-mascot bk-mascot--aide bk-mascot--gorevli"><img class="bk-mascot-pose" src="assets/maskot/gorevli.png" alt=""></div>
    </div>
  </div>
  <script>
    BK.scene("stories-scope", function (tl, root, BK) {
      var $ = function (s) { return root.querySelectorAll(s); };
      // Giriş (0 → 1.2): çerçeve, beş hikâye kartı soldan sağa, maskot
      BK.frame(tl, root, 0);
      BK.slam(tl, $(".ss-card"), 0.25, { stagger: 0.08, duration: 0.42 });
      BK.mascotIn(tl, "#stories-scope-mascot", 0.3, { from: "right" });

      // Adım 1 (1.45 → 2.35): kapsam içi — panel, üç fiil satırı, başlıkta "field problems"
      BK.slam(tl, "#ss-in", 1.45, { duration: 0.42 });
      BK.fade(tl, ".ss-dots", 1.6, { duration: 0.3, to: 0.45 });
      BK.rise(tl, $("#ss-in .ss-row"), 1.65, { y: 14, duration: 0.35, stagger: 0.1 });
      BK.scan(tl, "#ss-hl", 1.95, { duration: 0.35 });
      BK.mascotReact(tl, "#stories-scope-mascot", 1.5, { kind: "hop" });

      // Adım 2 (2.55 → 3.4): kapsam dışı — panel, dört satır, × işaretleri
      BK.slam(tl, "#ss-out", 2.55, { duration: 0.42 });
      BK.rise(tl, $("#ss-out .ss-txt"), 2.75, { y: 14, duration: 0.35, stagger: 0.08 });
      BK.formula(tl, $(".ss-x"), 2.8, { stagger: 0.08 });
      BK.mascotReact(tl, "#stories-scope-mascot", 2.6, { kind: "tilt", angle: 3 });
    });
  </script>
</template>
