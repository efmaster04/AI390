  <script>
    BK.scene("data-inventory", function (tl, root, BK) {
      var $ = function (s) { return root.querySelectorAll(s); };
      BK.frame(tl, root, 0);

      // 0 → 1.4: raf çarpar, dört bölme başlığı görünür; 01 belgeler dolar (kesikli = henüz yazılmadı); "planned" damgası
      BK.slam(tl, "#di-cab", 0.2, { duration: 0.45 });
      BK.fade(tl, $(".di-box"), 0.3, { duration: 0.3, stagger: 0.05 });
      BK.slam(tl, $(".di-doc"), 0.45, { stagger: 0.035, duration: 0.35 });
      BK.rise(tl, "#di-docs-l", 0.85, { y: 12, duration: 0.3 });
      BK.stamp(tl, "#di-stamp", 0.75, { rotation: -2 });
      BK.mascotIn(tl, "#di-mascot", 0.3, { from: "left" });

      // 1.45 → 2.5: 02 tablolar — 9 sayar, örnek tablolar, tickets sütunları
      BK.fade(tl, ["#di-nine", "#di-nine-k"], 1.45, { duration: 0.25 });
      BK.count(tl, "#di-nine", 9, 1.45, { duration: 0.5 });
      BK.slam(tl, $(".di-chip"), 1.5, { stagger: 0.07, duration: 0.35 });
      BK.rise(tl, ["#di-cols-k", "#di-cols"], 1.8, { y: 12, duration: 0.35, stagger: 0.08 });
      BK.mascotReact(tl, "#di-mascot", 1.5, { kind: "hop" });

      // 2.55 → 3.6: 03 aksiyon API — iki adım: taslak → vatandaş onayı → ticket

      BK.rise(tl, ["#di-ep1", "#di-ep2"], 2.95, { y: 10, duration: 0.3, stagger: 0.1 });
      BK.note(tl, "#di-note", 3.2);
      BK.mascotReact(tl, "#di-mascot", 2.6, { kind: "tilt", angle: 3 });

      // 3.65 → 4.7: 04 güvenilmeyen girdi kaynakları
      BK.slam(tl, $(".di-src"), 3.65, { stagger: 0.06, duration: 0.35 });
      BK.mascotReact(tl, "#di-mascot", 3.7, { kind: "hop" });
    });
