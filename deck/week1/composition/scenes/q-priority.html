<template id="q-priority-template">
  <style>
    #root { position: absolute; inset: 0; }
    [data-composition-id="q-priority"] #qp-yes { position: absolute; left: 150px; top: 400px; font-size: 120px; padding: 18px 46px; border-width: 9px; }
    [data-composition-id="q-priority"] .qp-panels { position: absolute; left: 600px; top: 366px; width: 1224px; display: flex; flex-direction: column; gap: 50px; }
    [data-composition-id="q-priority"] .qp-panels .bk-panel { padding-top: 34px; }
    [data-composition-id="q-priority"] .qp-panels p { font-size: 40px; line-height: 1.3; }
    [data-composition-id="q-priority"] .qp-chips { display: flex; gap: 18px; margin-top: 22px; }
    [data-composition-id="q-priority"] .qp-chip { padding: 6px 22px; background: var(--teal-soft); border: 4px solid var(--ink); border-radius: 30px; font-family: var(--font-mono); font-size: 32px; font-weight: 700; }
    [data-composition-id="q-priority"] .qp-flow { display: flex; align-items: center; margin-top: 22px; font-size: 40px; }
    [data-composition-id="q-priority"] .qp-null { font-family: var(--font-mono); font-weight: 700; padding: 4px 18px; border: 4px dashed var(--ink-2); border-radius: 10px; color: var(--ink-2); }
    [data-composition-id="q-priority"] .qp-flow .bk-arrow { width: 84px; margin: 0 26px; }
    [data-composition-id="q-priority"] .qp-est { font-family: var(--font-display); font-weight: 900; font-size: 48px; }
    [data-composition-id="q-priority"] #qp-mascot { left: 180px; top: 640px; --h: 330px; }
  </style>
  <div id="root" data-composition-id="q-priority" data-hold data-width="1920" data-height="1080" data-window="8" data-fragments="1.4">
    <div class="bk-stage">
      <div class="bk-sheet"></div>
      <header class="bk-band">
        <span class="bk-folio">BELDESK / QUESTIONS</span>
        <span class="bk-section">Questions · 03 / priority</span>
        <span class="bk-no">22 · Q3</span>
      </header>
      <div class="bk-rule"></div>
      <h2 class="bk-title">Is next week’s plan the change that matters most?</h2>

      <span id="qp-yes" class="bk-stamp bk-stamp--teal">Yes</span>
      <div class="qp-panels">
        <section id="qp-rules" class="bk-panel">
          <span class="bk-tab bk-tab--teal">Rules + labels</span>
          <p>Yes: versioned classifier rules and a larger labeled set make scope, urgency and abstention testable.</p>
          <div class="qp-chips"><span class="qp-chip">scope</span><span class="qp-chip">urgency</span><span class="qp-chip">abstention</span></div>
        </section>
        <section id="qp-harness" class="bk-panel">
          <span class="bk-tab bk-tab--sun">Harness + seeds</span>
          <p>The harness and several seeds turn null values into reproducible estimates before tool actions arrive.</p>
          <div class="qp-flow"><span class="qp-null">null</span><span class="bk-arrow"></span><span id="qp-est" class="qp-est bk-scan">reproducible estimates</span></div>
        </section>
      </div>
      <div id="qp-mascot" class="bk-mascot bk-mascot--gorevli"><img class="bk-mascot-pose" src="assets/maskot/gorevli.png" alt=""></div>
    </div>
  </div>
  <script>
    BK.scene("q-priority", function (tl, root, BK) {
      var $ = function (s) { return root.querySelectorAll(s); };
      BK.frame(tl, root, 0);
      BK.slam(tl, ["#qp-rules", "#qp-harness"], 0.22, { stagger: 0.12, duration: 0.45 });
      BK.formula(tl, $(".qp-chip"), 0.5, { stagger: 0.06 });
      BK.fade(tl, ".qp-null", 0.55, { duration: 0.25 });
      BK.draw(tl, ".qp-flow .bk-arrow", 0.62, { duration: 0.28 });
      BK.scan(tl, "#qp-est", 0.72, { duration: 0.35 });
      BK.mascotIn(tl, "#qp-mascot", 0.2, { from: "left" });
      // Cevap damgası vurulur, maskot sıçrar
      BK.stamp(tl, "#qp-yes", 0.7, { rotation: -3 });
      BK.mascotReact(tl, "#qp-mascot", 0.88, { kind: "squash" });
    });
  </script>
</template>
