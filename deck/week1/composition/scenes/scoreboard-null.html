<template id="scoreboard-null-template">
  <style>
    #root { position: absolute; inset: 0; }
    /* Sabit skor tablosu, 13 satırın tamamı (kaynak sırası). Sağda W1..W6 hafta ızgarası: her satır başlangıç haftasında işaretlenir.
       Ölçülen satır = teal dolu işaret W1'de; null satır = W1'den başlangıç haftasına bekleme çizgisi + kesikli halka. */
    [data-composition-id="scoreboard-null"] {
      --sn-m: 384px; --sn-v: 222px; --sn-l: 186px; --sn-w: 76px;   /* metrik | W1 değeri | geçen hafta | hafta sütunu */
    }
    [data-composition-id="scoreboard-null"] #sn-table { position: absolute; left: var(--edge-x); top: 284px; width: 1300px; padding: 10px 26px 8px; }
    [data-composition-id="scoreboard-null"] .sn-row {
      position: relative; display: grid; grid-template-columns: var(--sn-m) var(--sn-v) var(--sn-l) repeat(6, var(--sn-w));
      align-items: center; height: 45px; font-family: var(--font-mono); font-size: 30px;
    }
    [data-composition-id="scoreboard-null"] .sn-row + .sn-row { border-top: 2px dashed color-mix(in srgb, var(--ink) 22%, transparent); }
    [data-composition-id="scoreboard-null"] .sn-head { height: 46px; border-bottom: 3px solid var(--ink); }
    [data-composition-id="scoreboard-null"] .sn-head span { font-size: 28px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
    [data-composition-id="scoreboard-null"] .sn-head .sn-wk { text-align: center; color: var(--ink); }
    [data-composition-id="scoreboard-null"] .sn-name { font-weight: 700; font-size: 32px; }
    [data-composition-id="scoreboard-null"] .sn-last { color: var(--ink-2); }
    [data-composition-id="scoreboard-null"] .sn-val { font-weight: 700; color: var(--teal-ink); }
    [data-composition-id="scoreboard-null"] .sn-null {
      justify-self: start; padding: 0 12px; line-height: 34px; font-size: 28px; font-weight: 700; color: var(--ink-2);
      border: 3px dashed var(--ink-2); border-radius: 8px;
    }
    /* hafta sütunlarının açık zemin şeridi */
    [data-composition-id="scoreboard-null"] .sn-col {
      position: absolute; top: 10px; bottom: 8px; width: var(--sn-w); background: color-mix(in srgb, var(--paper) 75%, transparent);
      left: calc(26px + var(--sn-m) + var(--sn-v) + var(--sn-l) + (var(--k) - 1) * var(--sn-w));
    }
    [data-composition-id="scoreboard-null"] .sn-col--w1 { background: var(--teal-soft); opacity: .55; }
    /* bekleme çizgisi ve işaret: --wk satırın başlangıç haftası */
    [data-composition-id="scoreboard-null"] .sn-wait {
      position: absolute; top: 21px; height: 0; border-top: 4px dotted var(--ink-2);
      left: calc(var(--sn-m) + var(--sn-v) + var(--sn-l) + var(--sn-w) / 2);
      width: calc((var(--wk) - 1) * var(--sn-w) - 16px);
    }
    [data-composition-id="scoreboard-null"] .sn-mk {
      position: absolute; top: 6px; width: 32px; height: 32px; border-radius: 50%;
      left: calc(var(--sn-m) + var(--sn-v) + var(--sn-l) + (var(--wk) - 1) * var(--sn-w) + var(--sn-w) / 2 - 16px);
      background: var(--cream); border: 4px dashed var(--ink);
    }
    [data-composition-id="scoreboard-null"] .sn-mk--on { background: var(--teal); border: 4px solid var(--ink); }
    /* sağ sütun: 9 sayacı + damga */
    [data-composition-id="scoreboard-null"] #sn-nine { position: absolute; left: 1440px; top: 300px; width: 384px; padding: 34px 30px 26px; }
    [data-composition-id="scoreboard-null"] .sn-nine-n { display: flex; align-items: baseline; gap: 12px; font-family: var(--font-display); font-weight: 900; line-height: .9; }
    [data-composition-id="scoreboard-null"] #sn-9 { font-size: 150px; color: var(--tomato-ink); }
    [data-composition-id="scoreboard-null"] .sn-of { font-size: 60px; }
    [data-composition-id="scoreboard-null"] .sn-nine-l { display: block; margin-top: 12px; }
    [data-composition-id="scoreboard-null"] #sn-stamp { position: absolute; left: 1452px; top: 614px; font-size: 30px; }
    [data-composition-id="scoreboard-null"] #scoreboard-null-mascot { left: 1560px; top: 690px; --h: 296px; }
    [data-composition-id="scoreboard-null"] #sn-cap { position: absolute; top: 244px; left: calc(var(--edge-x) + 26px + var(--sn-m) + var(--sn-v) + var(--sn-l)); }
  </style>
  <div id="root" data-composition-id="scoreboard-null" data-hold data-width="1920" data-height="1080" data-window="8" data-fragments="1.4,2.5,3.6">
    <div class="bk-stage">
      <div class="bk-sheet"></div>
      <header class="bk-band"><span class="bk-folio">BELDESK / SCOREBOARD</span><span class="bk-section">Scoreboard</span><span class="bk-no">20 / 22</span></header>
      <div class="bk-rule"></div>
      <h2 class="bk-title"><span id="sn-key" class="bk-scan">Nine metrics stay null</span> until they are measured</h2>

      <span id="sn-cap" class="bk-label">starts</span>
      <section id="sn-table" class="bk-panel">
        <div class="sn-col sn-col--w1" style="--k:1"></div>
        <div class="sn-col" style="--k:3"></div>
        <div class="sn-col" style="--k:5"></div>
        <div class="sn-row sn-head"><span>metric</span><span>this week</span><span>last week</span>
          <span id="sn-h1" class="sn-wk">W1</span><span id="sn-h2" class="sn-wk">W2</span><span id="sn-h3" class="sn-wk">W3</span>
          <span id="sn-h4" class="sn-wk">W4</span><span id="sn-h5" class="sn-wk">W5</span><span id="sn-h6" class="sn-wk">W6</span></div>
        <div class="sn-row" style="--wk:1"><span class="sn-name">test_set_size</span><span class="sn-val">25</span><span class="sn-last">—</span><i class="sn-mk sn-mk--on"></i></div>
        <div class="sn-row sn-r-null" style="--wk:2"><span class="sn-name">e2e_accuracy</span><span class="sn-null">null</span><span class="sn-last">—</span><i class="sn-wait"></i><i class="sn-mk"></i></div>
        <div class="sn-row sn-r-null" style="--wk:2"><span class="sn-name">abstention_correct</span><span class="sn-null">null</span><span class="sn-last">—</span><i class="sn-wait"></i><i class="sn-mk"></i></div>
        <div class="sn-row sn-r-null" style="--wk:3"><span class="sn-name">unsupported_claims</span><span class="sn-null">null</span><span class="sn-last">—</span><i class="sn-wait"></i><i class="sn-mk"></i></div>
        <div class="sn-row sn-r-null" style="--wk:3"><span class="sn-name">hit_at_5</span><span class="sn-null">null</span><span class="sn-last">—</span><i class="sn-wait"></i><i class="sn-mk"></i></div>
        <div class="sn-row sn-r-null" style="--wk:3"><span class="sn-name">mrr</span><span class="sn-null">null</span><span class="sn-last">—</span><i class="sn-wait"></i><i class="sn-mk"></i></div>
        <div class="sn-row sn-r-null" style="--wk:4"><span class="sn-name">task_success</span><span class="sn-null">null</span><span class="sn-last">—</span><i class="sn-wait"></i><i class="sn-mk"></i></div>
        <div class="sn-row sn-r-null" style="--wk:6"><span class="sn-name">pass_k</span><span class="sn-null">null</span><span class="sn-last">—</span><i class="sn-wait"></i><i class="sn-mk"></i></div>
        <div class="sn-row sn-r-null" style="--wk:5"><span class="sn-name">injection_success</span><span class="sn-null">null</span><span class="sn-last">—</span><i class="sn-wait"></i><i class="sn-mk"></i></div>
        <div class="sn-row" style="--wk:1"><span class="sn-name">cost_per_task_usd</span><span class="sn-val">$0.00020593</span><span class="sn-last">—</span><i class="sn-mk sn-mk--on"></i></div>
        <div class="sn-row sn-r-null" style="--wk:2"><span class="sn-name">latency_p50_s</span><span class="sn-null">null</span><span class="sn-last">—</span><i class="sn-wait"></i><i class="sn-mk"></i></div>
        <div class="sn-row" style="--wk:1"><span class="sn-name">spend_week_usd</span><span class="sn-val">$0</span><span class="sn-last">—</span><i class="sn-mk sn-mk--on"></i></div>
        <div class="sn-row" style="--wk:1"><span class="sn-name">spend_total_usd</span><span class="sn-val">$0</span><span class="sn-last">—</span><i class="sn-mk sn-mk--on"></i></div>
      </section>

      <section id="sn-nine" class="bk-panel">
        <span class="bk-tab bk-tab--tomato">not measured yet</span>
        <div class="sn-nine-n"><span id="sn-9">9</span><span class="sn-of">/ 13</span></div>
        <span class="bk-label sn-nine-l">rows null</span>
      </section>
      <span id="sn-stamp" class="bk-stamp" data-layout-allow-overlap>never estimated</span>

      <div class="bk-repo"><span class="bk-repo-k">repo</span>reports/week-1.md</div>
      <div id="scoreboard-null-mascot" class="bk-mascot bk-mascot--aide bk-mascot--dusunen"><img class="bk-mascot-pose" src="assets/maskot/dusunen.png" alt=""></div>
    </div>
  </div>
  <script>
    BK.scene("scoreboard-null", function (tl, root, BK) {
      var $ = function (s) { return root.querySelectorAll(s); };
      var P = BK.plan([1.1, 1.1]);   // bekleme: 1.4 tablo · 2.5 haftalar · 3.6 damga
      BK.frame(tl, root, 0);
      // Adım 0: tablo kâğıdı oturur, 13 satır yukarıdan aşağı akar; 9 sayacı sayar
      BK.slam(tl, "#sn-table", 0.25, { duration: 0.42 });
      BK.rise(tl, $(".sn-row"), 0.4, { y: 10, duration: 0.3, stagger: 0.035 });
      BK.slam(tl, "#sn-nine", 0.45, { duration: 0.42 });
      BK.count(tl, "#sn-9", 9, 0.55, { duration: 0.55 });
      BK.mascotIn(tl, "#scoreboard-null-mascot", 0.3, { from: "right" });
      // Adım 1: hafta ızgarası dolar: W1'de 4 teal işaret, null satırlar başlangıç haftasına bekleme çizgisi + halka
      BK.fade(tl, $(".sn-col"), P.at[1], { duration: 0.3 });
      BK.rise(tl, "#sn-cap", P.at[1], { y: 8, duration: 0.3 });
      BK.formula(tl, $(".sn-mk--on"), P.at[1] + 0.05, { stagger: 0.05 });
      BK.draw(tl, $(".sn-wait"), P.at[1] + 0.1, { duration: 0.35, stagger: 0.03 });
      BK.formula(tl, $(".sn-r-null .sn-mk"), P.at[1] + 0.3, { stagger: 0.02 });
      BK.mascotReact(tl, "#scoreboard-null-mascot", P.at[1] + 0.1, { kind: "tilt", angle: 3 });
      // Adım 2: damga; başlıktaki kilit ifade kalemle çizilir; maskot kısa sıçrar
      BK.stamp(tl, "#sn-stamp", P.at[2] + 0.05);
      BK.scan(tl, "#sn-key", P.at[2] + 0.1, { duration: 0.45 });
      BK.mascotReact(tl, "#scoreboard-null-mascot", P.at[2] + 0.25, { kind: "hop" });
    });
  </script>
</template>
