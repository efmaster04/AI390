  <script>
    BK.scene("team-agreement", function (tl, root, BK) {
      var $ = function (s) { return root.querySelectorAll(s); };
      // Giriş (→ 1.4): çerçeve + §1 roller bandı, üç üye sırayla; §2–§5 yuvaları belirir; maskot el sallar
      BK.frame(tl, root, 0);
      BK.slam(tl, "#team-agreement-roles", 0.3, { duration: 0.45 });
      BK.rise(tl, $(".ta-member"), 0.5, { y: 14, duration: 0.4, stagger: 0.1 });
      BK.fade(tl, $(".ta-slot"), 0.6, { duration: 0.35, stagger: 0.05 });
      BK.mascotIn(tl, "#team-agreement-mascot", 0.25, { from: "right" });

      // Adım 1 (1.45 → 2.5): toplantılar + karar kuralı yuvalarına oturur; oklar çizilir, başlıkta tek vurgu
      var t1 = 1.45;
      BK.slam(tl, $(".ta-step1"), t1, { stagger: 0.1, duration: 0.42 });
      BK.draw(tl, $(".ta-down1"), t1 + 0.35, { axis: "y", duration: 0.2, stagger: 0.15 });
      BK.scan(tl, "#team-agreement-hl", t1 + 0.4, { duration: 0.45 });
      BK.mascotReact(tl, "#team-agreement-mascot", t1 + 0.1, { kind: "hop" });

      // Adım 2 (2.55 → 3.6): teslim edemezse + ders sonrası sahiplik; künyeye imzalar eksik damgası
      var t2 = 2.55;
      BK.slam(tl, $(".ta-step2"), t2, { stagger: 0.1, duration: 0.42 });
      BK.draw(tl, $(".ta-down2"), t2 + 0.35, { axis: "y", duration: 0.2, stagger: 0.15 });
      BK.stamp(tl, "#team-agreement-stamp", t2 + 0.5, { rotation: -2 });
      BK.mascotReact(tl, "#team-agreement-mascot", t2 + 0.45, { kind: "tilt", angle: -4 });
    });
