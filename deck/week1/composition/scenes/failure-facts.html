<template id="failure-facts-template">
  <style>
    #root { position: absolute; inset: 0; }
    /* İki kanıt kartı: alıntı + boş kaynak yuvası (adım 2'de "no source" damgası yuvaya iner) */
    [data-composition-id="failure-facts"] .ff-card { position: absolute; top: 300px; height: 386px; display: flex; flex-direction: column; padding: 46px 28px 28px; border-left: 16px solid var(--tomato); }
    [data-composition-id="failure-facts"] #ff-card1 { left: var(--edge-x); width: 840px; }
    [data-composition-id="failure-facts"] #ff-card2 { left: 980px; width: 844px; }
    [data-composition-id="failure-facts"] .ff-quote { font-family: var(--font-display); font-weight: 700; font-size: 42px; line-height: 1.2; }
    [data-composition-id="failure-facts"] .ff-fact { font-family: var(--font-mono); font-weight: 700; font-size: 48px; white-space: nowrap; }
    [data-composition-id="failure-facts"] .ff-en { margin-top: 10px; font-family: var(--font-body); font-style: italic; font-weight: 700; font-size: 36px; line-height: 1.2; color: var(--ink); }
    [data-composition-id="failure-facts"] .ff-en b { display: inline-block; margin-right: 8px; padding: 0 8px; border-radius: 6px; background: var(--blush); font-style: normal; font-family: var(--font-mono); font-size: 28px; color: var(--ink); }
    [data-composition-id="failure-facts"] .ff-ctx { flex: 1; font-family: var(--font-body); font-weight: 700; font-size: 36px; line-height: 1.15; color: var(--ink); }
    /* Alt satır: kaynak yuvası (+ birinci kartta sayaç) */
    [data-composition-id="failure-facts"] .ff-foot { margin-top: auto; height: 132px; display: flex; align-items: center; gap: 30px; }
    [data-composition-id="failure-facts"] .ff-slot { position: relative; flex: none; display: flex; align-items: center; height: 84px; width: 400px; padding: 0 18px; border: 3px dashed var(--ink-2); border-radius: 12px; background: var(--paper); }
    [data-composition-id="failure-facts"] .ff-slot-k { font-family: var(--font-mono); font-weight: 700; font-size: 28px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
    [data-composition-id="failure-facts"] .ff-slot .bk-stamp { position: absolute; left: 140px; top: 13px; font-size: 32px; padding: 4px 16px; }
    [data-composition-id="failure-facts"] .ff-count { display: flex; flex-direction: column; gap: 6px; }
    [data-composition-id="failure-facts"] .ff-count-fig { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
    [data-composition-id="failure-facts"] .ff-count-n { font-family: var(--font-display); font-weight: 900; font-size: 76px; line-height: 1; color: var(--tomato-ink); font-variant-numeric: tabular-nums; }
    [data-composition-id="failure-facts"] .ff-count-of { font-family: var(--font-display); font-weight: 900; font-size: 48px; line-height: 1; }
    [data-composition-id="failure-facts"] .ff-count-l { display: block; width: 330px; font-family: var(--font-mono); font-weight: 700; font-size: 28px; line-height: 1.1; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-2); }
    /* Kök neden → düzeltme */
    [data-composition-id="failure-facts"] .ff-why { position: absolute; top: 756px; height: 204px; padding: 38px 30px 20px; }
    [data-composition-id="failure-facts"] .ff-why .bk-label { display: block; margin-bottom: 6px; }
    [data-composition-id="failure-facts"] #ff-cause { left: var(--edge-x); width: 640px; border-left: 16px solid var(--tomato); }
    [data-composition-id="failure-facts"] #ff-fix { left: 840px; width: 680px; border-left: 16px solid var(--teal); }
    [data-composition-id="failure-facts"] .ff-why p { font-size: 40px; line-height: 1.18; }
    [data-composition-id="failure-facts"] .ff-link { position: absolute; left: 756px; top: 850px; color: var(--ink); }
    [data-composition-id="failure-facts"] .ff-link .bk-arrow { width: 60px; margin: 0; }
    /* Giriş karesinde sonraki adımın yeri: kesikli boş yer tutucu (panel gelince altında kalır) */
    [data-composition-id="failure-facts"] .ff-ghost { position: absolute; top: 756px; height: 204px; border: 3px dashed var(--shadow); border-radius: var(--radius); }
    [data-composition-id="failure-facts"] #ff-ghost1 { left: var(--edge-x); width: 640px; }
    [data-composition-id="failure-facts"] #ff-ghost2 { left: 840px; width: 680px; }
    [data-composition-id="failure-facts"] #failure-facts-mascot { left: 1572px; top: 708px; }
  </style>
  <div id="root" data-composition-id="failure-facts" data-hold data-width="1920" data-height="1080" data-window="8" data-fragments="1.4,2.5,3.6">
    <div class="bk-stage">
      <div class="bk-sheet"></div>
      <header class="bk-band"><span class="bk-deliv"><span class="bk-deliv-id">W1.5</span>Observed failure</span><span class="bk-section">W1.5 observation</span><span class="bk-no">16 / 22</span></header>
      <div class="bk-rule"></div>
      <h2 class="bk-title">Fluent answers <span id="ff-hl" class="bk-scan">invented local facts</span></h2>

      <!-- Kart 1: W1-01 / t0.7 · contact -->
      <div id="ff-card1" class="bk-panel ff-card">
        <span class="bk-tab bk-tab--tomato">W1-01 / t0.7 · contact</span>
        <p class="ff-quote">“<span id="ff-mark1" class="bk-scan bk-scan--tomato ff-fact">444 00 00</span> numaralı çağrı merkezimizi arayabilir …”</p>
        <p class="ff-en"><b>EN</b>“You can call our 444 00 00 call center …”</p>
        <div class="ff-foot">
          <div class="ff-slot">
            <span class="ff-slot-k">source</span>
            <span id="ff-stamp1" class="bk-stamp bk-stamp--on-cream">no source</span>
          </div>
          <div id="ff-count" class="ff-count">
            <span class="ff-count-fig"><span id="ff-count-n" class="ff-count-n">7</span><span class="ff-count-of">/ 75</span></span>
            <span class="ff-count-l">replies with a numeric 444 number</span>
          </div>
        </div>
      </div>

      <!-- Kart 2: W1-04 / t1.2 · fee -->
      <div id="ff-card2" class="bk-panel ff-card">
        <span class="bk-tab bk-tab--tomato">W1-04 / t1.2 · fee</span>
        <p class="ff-quote">“Registration is currently <span id="ff-mark2" class="bk-scan bk-scan--tomato">free of charge</span>.”</p>
        <div class="ff-foot">
          <div class="ff-slot">
            <span class="ff-slot-k">source</span>
            <span id="ff-stamp2" class="bk-stamp bk-stamp--on-cream">no source</span>
          </div>
          <p id="ff-ctx" class="ff-ctx">No populated fee table in model context</p>
        </div>
      </div>

      <!-- Giriş yer tutucuları: kök neden ve düzeltmenin yeri -->
      <div id="ff-ghost1" class="ff-ghost" data-layout-allow-overlap></div>
      <div id="ff-ghost2" class="ff-ghost" data-layout-allow-overlap></div>

      <!-- Adım 3: kök neden → düzeltme -->
      <div id="ff-cause" class="bk-panel ff-why">
        <span class="bk-tab bk-tab--tomato">Root cause</span>
        <span class="bk-label">generation</span>
        <p>Answers had no grounding in municipal records.</p>
      </div>
      <div id="ff-link" class="ff-link"><span class="bk-arrow"></span></div>
      <div id="ff-fix" class="bk-panel ff-why">
        <span class="bk-tab bk-tab--teal">Fix · W3</span>
        <span class="bk-label">Data and retrieval lead</span>
        <p><span id="ff-fixhl" class="bk-scan bk-scan--teal">RAG with citations</span>; say when source data is unavailable.</p>
      </div>

      <div class="bk-repo"><span class="bk-repo-k">repo</span>docs/baseline_analysis_week1.md</div>
      <div id="failure-facts-mascot" class="bk-mascot bk-mascot--aide bk-mascot--unutkan"><img class="bk-mascot-pose" src="assets/maskot/unutkan.png" alt=""></div>
    </div>
  </div>
  <script>
    BK.scene("failure-facts", function (tl, root, BK) {
      // Giriş (→ 1.4): iki alıntı kartı çarpar, uydurma olgular kırmızı fosforla taranır
      BK.frame(tl, root, 0);
      BK.slam(tl, ["#ff-card1", "#ff-card2"], 0.3, { stagger: 0.12, duration: 0.45 });
      BK.scan(tl, ["#ff-mark1", "#ff-mark2"], 0.75, { duration: 0.35, stagger: 0.1 });
      BK.fade(tl, ".ff-ghost", 0.6, { duration: 0.3 });
      BK.mascotIn(tl, "#failure-facts-mascot", 0.25, { from: "right" });

      // Adım 2 (1.45 → 2.5): kaynak yuvalarına "no source" damgaları; 444 sayacı 0 → 7
      var t2 = 1.45;
      BK.stamp(tl, "#ff-stamp1", t2 + 0.1, { rotation: -3 });
      BK.stamp(tl, "#ff-stamp2", t2 + 0.3, { rotation: 2 });
      BK.rise(tl, "#ff-count", t2 + 0.15, { y: 12, duration: 0.35 });
      BK.rise(tl, "#ff-ctx", t2 + 0.35, { y: 12, duration: 0.35 });
      BK.count(tl, "#ff-count-n", 7, t2 + 0.2, { duration: 0.55 });
      BK.mascotReact(tl, "#failure-facts-mascot", t2 + 0.35, { kind: "shake" });

      // Adım 3 (2.55 → 3.6): kök neden → ok → düzeltme; başlıktaki kilit ifade taranır
      var t3 = 2.55;
      BK.slam(tl, "#ff-cause", t3, { duration: 0.42 });
      BK.draw(tl, "#ff-link .bk-arrow", t3 + 0.3, { duration: 0.25 });
      BK.slam(tl, "#ff-fix", t3 + 0.4, { duration: 0.42 });
      BK.scan(tl, "#ff-fixhl", t3 + 0.5, { duration: 0.3 });
      BK.scan(tl, "#ff-hl", t3 + 0.1, { duration: 0.45 });
      BK.mascotReact(tl, "#failure-facts-mascot", t3 + 0.5, { kind: "hop" });
    });
  </script>
</template>
