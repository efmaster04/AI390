<template id="next-week-template">
  <style>
    #root { position: absolute; inset: 0; }
    /* Üç iş kartı = Week 2'nin üç işi. Her kartın altında "number to move": hangi sayı nereden nereye gidecek.
       Kartlar kesikli boş yuvalara sırayla oturur (fragment başına bir kart). */
    [data-composition-id="next-week"] .nw-grid {
      position: absolute; left: var(--edge-x); top: 290px; width: 1460px; height: 708px;
      display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 32px;
    }
    [data-composition-id="next-week"] .nw-slot { position: relative; }
    [data-composition-id="next-week"] .nw-ghost {
      position: absolute; inset: 0; border: 4px dashed color-mix(in srgb, var(--ink) 35%, transparent); border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-weight: 900; font-size: 120px; color: color-mix(in srgb, var(--ink) 18%, transparent);
    }
    [data-composition-id="next-week"] .nw-card { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 40px 26px 24px; }
    [data-composition-id="next-week"] .nw-h { font-family: var(--font-display); font-weight: 900; font-size: 44px; line-height: 1.04; }
    [data-composition-id="next-week"] .nw-sub { margin-top: 12px; font-size: 40px; line-height: 1.1; color: var(--ink-2); }
    /* Sabit yükseklik: üç kartın ayracı ve "NUMBER TO MOVE" etiketi aynı y'de; null → measured satırı alta oturur */
    [data-composition-id="next-week"] .nw-move {
      margin-top: auto; flex: none; height: 324px; display: flex; flex-direction: column;
      padding-top: 14px; border-top: 4px dashed var(--ink);
    }
    [data-composition-id="next-week"] .nw-move .bk-label { display: block; margin-bottom: 10px; }
    [data-composition-id="next-week"] .nw-chips { display: flex; flex-wrap: wrap; gap: 6px 10px; }
    [data-composition-id="next-week"] .nw-chip {
      padding: 0 10px; border: 3px solid var(--ink); border-radius: 8px; background: var(--paper);
      font-family: var(--font-mono); font-weight: 700; font-size: 28px; letter-spacing: -.02em; line-height: 1.25; padding-top: 4px; padding-bottom: 4px;
    }
    [data-composition-id="next-week"] .nw-ft { display: flex; align-items: center; gap: 4px; margin-top: auto; padding-top: 10px; }
    [data-composition-id="next-week"] .nw-from, [data-composition-id="next-week"] .nw-to {
      font-family: var(--font-mono); font-weight: 700; font-size: 36px; line-height: 50px; padding: 0 14px; border-radius: 10px; white-space: nowrap;
    }
    [data-composition-id="next-week"] .nw-from { border: 3px dashed var(--ink-2); color: var(--ink-2); }
    [data-composition-id="next-week"] .nw-to { border: 3px solid var(--ink); background: var(--teal-soft); color: var(--ink); box-shadow: 4px 4px 0 var(--ink); }
    [data-composition-id="next-week"] .nw-ft .bk-arrow { width: 52px; color: var(--ink); }
    [data-composition-id="next-week"] .nw-big { margin-top: 14px; font-family: var(--font-display); font-weight: 900; font-size: 84px; line-height: 1; }
    [data-composition-id="next-week"] .nw-big .nw-dim { color: var(--ink-2); }
    [data-composition-id="next-week"] .nw-note { margin-top: 6px; font-size: 32px; line-height: 1.2; color: var(--ink-2); }
    [data-composition-id="next-week"] #next-week-mascot { left: 1582px; top: 690px; --h: 288px; }
  </style>
  <div id="root" data-composition-id="next-week" data-hold data-width="1920" data-height="1080" data-window="8" data-fragments="1.4,2.5,3.6">
    <div class="bk-stage">
      <div class="bk-sheet"></div>
      <header class="bk-band"><span class="bk-folio">BELDESK / NEXT WEEK</span><span class="bk-section">Next week</span><span class="bk-no">21 / 22</span></header>
      <div class="bk-rule"></div>
      <h2 class="bk-title">Week 2 turns behavior into <span id="nw-key" class="bk-scan">measured baselines</span></h2>

      <div class="nw-grid">
        <div class="nw-slot"><div class="nw-ghost" data-layout-allow-overlap>01</div>
          <article id="nw-c1" class="bk-panel bk-panel--sun nw-card">
            <span class="bk-tab bk-tab--sun">01</span>
            <h3 class="nw-h">Versioned JSON classifier</h3>
            <p class="nw-sub">Explicit scope, urgency and privacy rules</p>
            <div class="nw-move"><span class="bk-label">Number to move</span>
              <div class="nw-chips"><span class="nw-chip">JSON validity</span><span class="nw-chip">intent/urgency accuracy</span><span class="nw-chip">abstention correctness</span></div>
              <div class="nw-ft"><span class="nw-from">null</span><span id="nw-a1" class="bk-arrow"></span><span id="nw-t1" class="nw-to">measured</span></div>
            </div>
          </article>
        </div>
        <div class="nw-slot"><div class="nw-ghost" data-layout-allow-overlap>02</div>
          <article id="nw-c2" class="bk-panel bk-panel--sun nw-card">
            <span class="bk-tab bk-tab--sun">02</span>
            <h3 class="nw-h">Expand the versioned test set</h3>
            <p class="nw-sub">Add P4, P3/P4 boundaries and paired TR/EN inputs</p>
            <div class="nw-move"><span class="bk-label">Number to move</span>
              <div class="nw-chips"><span class="nw-chip">test-set size</span></div>
              <div class="nw-big"><span class="nw-dim">25</span><span id="nw-a2" class="bk-arrow"></span><span id="nw-40">40</span></div>
              <p class="nw-note"><b class="t-ink">planned</b>; coverage becomes testable</p>
            </div>
          </article>
        </div>
        <div class="nw-slot"><div class="nw-ghost" data-layout-allow-overlap>03</div>
          <article id="nw-c3" class="bk-panel bk-panel--sun nw-card">
            <span class="bk-tab bk-tab--sun">03</span>
            <h3 class="nw-h">Build the evaluation harness</h3>
            <p class="nw-sub">Calibrated LLM judge; several seeds per input</p>
            <div class="nw-move"><span class="bk-label">Number to move</span>
              <div class="nw-chips"><span class="nw-chip">e2e accuracy + n/95% interval</span><span class="nw-chip">judge agreement</span><span class="nw-chip">variability</span></div>
              <div class="nw-ft"><span class="nw-from">null</span><span id="nw-a3" class="bk-arrow"></span><span id="nw-t3" class="nw-to">measured</span></div>
            </div>
          </article>
        </div>
      </div>

      <div id="next-week-mascot" class="bk-mascot bk-mascot--aide bk-mascot--gorevli"><img class="bk-mascot-pose" src="assets/maskot/gorevli.png" alt=""></div>
    </div>
  </div>
  <script>
    BK.scene("next-week", function (tl, root, BK) {
      var $ = function (s) { return root.querySelectorAll(s); };
      var P = BK.plan([1.1, 1.1]);   // bekleme: 1.4 kart 1 · 2.5 kart 2 · 3.6 kart 3
      BK.frame(tl, root, 0);
      BK.fade(tl, $(".nw-ghost"), 0.3, { duration: 0.3, stagger: 0.06 });
      BK.mascotIn(tl, "#next-week-mascot", 0.25, { from: "right" });
      // Kart 1: yuvaya oturur, ok çizilir, "measured" pop
      BK.slam(tl, "#nw-c1", 0.4, { duration: 0.45 });
      BK.draw(tl, "#nw-a1", 0.8, { duration: 0.25 });
      BK.formula(tl, "#nw-t1", 0.95);
      // Kart 2: 25 → 40 sayar
      BK.slam(tl, "#nw-c2", P.at[1], { duration: 0.45 });
      BK.draw(tl, "#nw-a2", P.at[1] + 0.35, { duration: 0.25 });
      BK.count(tl, "#nw-40", 40, P.at[1] + 0.45, { from: 25, duration: 0.4 });
      BK.mascotReact(tl, "#next-week-mascot", P.at[1] + 0.1, { kind: "hop" });
      // Kart 3 + başlıktaki kilit ifade
      BK.slam(tl, "#nw-c3", P.at[2], { duration: 0.45 });
      BK.draw(tl, "#nw-a3", P.at[2] + 0.35, { duration: 0.25 });
      BK.formula(tl, "#nw-t3", P.at[2] + 0.5);
      BK.scan(tl, "#nw-key", P.at[2] + 0.4, { duration: 0.4 });
      BK.mascotReact(tl, "#next-week-mascot", P.at[2] + 0.1, { kind: "hop" });
    });
  </script>
</template>
