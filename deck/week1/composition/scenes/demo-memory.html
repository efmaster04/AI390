<template id="demo-memory-template">
  <style>
    #root { position: absolute; inset: 0; }
    [data-composition-id="demo-memory"] .bk-title { right: 120px; }
    [data-composition-id="demo-memory"] .dm-term { left: var(--edge-x); top: 338px; width: 1200px; height: 662px; }
    [data-composition-id="demo-memory"] .dm-turn { position: relative; }
    [data-composition-id="demo-memory"] .dm-turn + .dm-turn { margin-top: 10px; padding-top: 8px; border-top: 3px dashed var(--term-rule); }
    [data-composition-id="demo-memory"] .bk-term-body { font-size: 34px; line-height: 1.26; padding: 14px 20px 16px; }
    [data-composition-id="demo-memory"] .bk-term-en b { margin-right: 8px; }
    [data-composition-id="demo-memory"] .bk-term-line + .bk-term-line { margin-top: 8px; }
    [data-composition-id="demo-memory"] .bk-term-meta { margin-top: 4px; }
    [data-composition-id="demo-memory"] .bk-term-en { margin-top: 6px; }
    [data-composition-id="demo-memory"] .dm-note1 { right: 20px; top: 136px; }
    [data-composition-id="demo-memory"] .dm-note2 { right: 20px; top: 152px; }
    [data-composition-id="demo-memory"] #dm-mascot { left: 1318px; top: 470px; --h: 520px; }
    [data-composition-id="demo-memory"] .dm-cmd { position: absolute; left: 1400px; top: 352px; bottom: auto; padding: 8px 16px; font-size: 28px; }
    /* Adım 3: iki ayrı paket (zarf) */
    [data-composition-id="demo-memory"] .dm-env { position: absolute; top: 424px; width: 540px; height: 420px; padding: 96px 38px 26px; background: var(--cream); }
    [data-composition-id="demo-memory"] #dm-env1 { left: 140px; }
    [data-composition-id="demo-memory"] #dm-env2 { left: 730px; }
    [data-composition-id="demo-memory"] .dm-flap { position: absolute; left: 0; top: 0; width: 100%; height: 120px; overflow: visible; }
    [data-composition-id="demo-memory"] .dm-flap polyline { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linejoin: round; }
    [data-composition-id="demo-memory"] .dm-sees { display: block; font-family: var(--font-mono); font-weight: 700; font-size: 28px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
    [data-composition-id="demo-memory"] .dm-sys { display: inline-block; margin-top: 10px; padding: 2px 12px; border: 3px solid var(--ink); border-radius: 8px; background: var(--teal-soft); font-family: var(--font-mono); font-weight: 700; font-size: 28px; }
    [data-composition-id="demo-memory"] .dm-msg { display: block; margin-top: 6px; font-family: var(--font-mono); font-weight: 700; font-size: 44px; }
    [data-composition-id="demo-memory"] .dm-tok { position: absolute; left: 38px; bottom: 26px; font-family: var(--font-mono); font-weight: 700; font-size: 34px; }
    [data-composition-id="demo-memory"] .dm-ghost { position: relative; display: inline-block; margin-top: 6px; font-family: var(--font-mono); font-size: 36px; color: var(--ink-2); }
    [data-composition-id="demo-memory"] .dm-strike { position: absolute; left: -6px; right: -6px; top: 50%; height: 7px; margin-top: -3px; border-radius: 4px; background: var(--tomato); }
    [data-composition-id="demo-memory"] .dm-env-stamp { position: absolute; right: 30px; bottom: 22px; font-size: 34px; }
    [data-composition-id="demo-memory"] .dm-note3 { left: 1044px; top: 676px; }
    /* Adım 4: çıkarım */
    [data-composition-id="demo-memory"] .dm-take { position: absolute; left: 124px; top: 872px; font-size: 42px; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="demo-memory" data-hold data-width="1920" data-height="1080" data-window="11" data-fragments="1.4,4.7,8,9.1,10">
    <div class="bk-stage">
      <div class="bk-sheet"></div>
      <header class="bk-band">
        <span class="bk-folio">Live demo / 01</span>
        <span class="bk-section">Live demo</span>
        <span class="bk-no">08 / 22</span>
      </header>
      <div class="bk-rule"></div>
      <h2 class="bk-title">Each message travels alone, so the assistant forgets the name</h2>

      <div id="dm-term" class="bk-term dm-term" data-layout-allow-overlap>
        <div class="bk-term-bar"><i></i><i></i><i></i><b>scripts/try_chat.py</b></div>
        <div id="dm-body" class="bk-term-body">
          <div class="dm-turn">
            <div class="bk-term-line"><span class="bk-term-you">you&gt;</span> <span id="dm-you1">Adım Doruk.</span><span id="dm-caret1" class="bk-caret"></span></div>
            <div class="bk-term-line"><span id="dm-bot1-p" class="bk-term-bot">beldesk&gt;</span> <span id="dm-bot1">Merhaba <span id="dm-mark1" class="bk-scan bk-scan--full bk-scan--teal-solid">Doruk</span>, ben Yeşilvadi Belediyesi sanal asistanı. Size nasıl yardımcı olabilirim?</span></div>
            <span id="dm-meta1" class="bk-term-meta">[tokens in=63 out=21 | 3.6s | finish=STOP]</span>
            <span id="dm-en1" class="bk-term-en"><b>EN</b>Hello Doruk, I am the Yeşilvadi Municipality virtual assistant. How can I help you?</span>
            <span id="dm-note1" class="bk-note bk-note--plain bk-note--on-dark bk-note--teal dm-note1">name in request</span>
          </div>
          <div id="dm-turn2" class="dm-turn">
            <div class="bk-term-line"><span id="dm-you2-p" class="bk-term-you">you&gt;</span> <span id="dm-you2">Adım neydi?</span><span id="dm-caret2" class="bk-caret"></span></div>
            <div class="bk-term-line"><span id="dm-bot2-p" class="bk-term-bot">beldesk&gt;</span> <span id="dm-bot2">Üzgünüm, kişisel verilerinizi göremediğim için <span id="dm-mark2" class="bk-scan bk-scan--full bk-scan--tomato-solid">adınızı bilmiyorum</span>. Size nasıl yardımcı olabilirim?</span></div>
            <span id="dm-meta2" class="bk-term-meta">[tokens in=63 out=25 | 14.6s | finish=STOP]</span>
            <span id="dm-en2" class="bk-term-en"><b>EN</b>Sorry, I can't see your personal data, so I don't know your name. How can I help you?</span>
            <span id="dm-note2" class="bk-note bk-note--plain bk-note--on-dark dm-note2">name not in request</span>
          </div>
        </div>
      </div>

      <!-- Adım 3: model iki ayrı paket görür -->
      <div id="dm-env1" class="bk-panel dm-env" data-layout-allow-overlap>
        <svg class="dm-flap" viewBox="0 0 540 120" preserveAspectRatio="none"><polyline points="0,0 270,80 540,0"/></svg>
        <span class="bk-tab bk-tab--teal">Request 1</span>
        <span class="dm-sees">model sees</span>
        <span class="dm-sys">system prompt +</span>
        <span class="dm-msg">Adım Doruk.</span>
        <span class="dm-tok"><span id="dm-in1" class="bk-scan">in=63</span></span>
        <span id="dm-stamp1" class="bk-stamp bk-stamp--teal bk-stamp--on-cream dm-env-stamp">sent</span>
      </div>
      <div id="dm-env2" class="bk-panel dm-env" data-layout-allow-overlap>
        <svg class="dm-flap" viewBox="0 0 540 120" preserveAspectRatio="none"><polyline points="0,0 270,80 540,0"/></svg>
        <span class="bk-tab bk-tab--tomato">Request 2</span>
        <span class="dm-sees">model sees</span>
        <span class="dm-sys">system prompt +</span>
        <span class="dm-msg">Adım neydi?</span>
        <span id="dm-ghost" class="dm-ghost">Adım Doruk.<span id="dm-strike" class="dm-strike"></span></span>
        <span class="dm-tok"><span id="dm-in2" class="bk-scan">in=63</span></span>
        <span id="dm-stamp2" class="bk-stamp bk-stamp--on-cream dm-env-stamp">no history</span>
      </div>
      <span id="dm-note3" class="bk-note dm-note3" data-layout-allow-overlap>not sent</span>

      <!-- Adım 4: çıkarım -->
      <p id="dm-take" class="bk-callout dm-take" data-layout-allow-overlap>Stateless: the earlier turn never reaches the model.</p>

      <span id="dm-cmd" class="bk-repo dm-cmd"><span class="bk-repo-k">run</span>try_chat.py</span>
      <div id="dm-mascot" class="bk-mascot bk-mascot--yaziyor">
        <img id="dm-pose-a" class="bk-mascot-pose" src="assets/maskot/yaziyor.png" alt="">
        <img id="dm-pose-b" class="bk-mascot-pose" src="assets/maskot/unutkan.png" alt="">
      </div>
    </div>
  </div>
  <script>
    BK.scene("demo-memory", function (tl, root, BK) {
      // ---- Giriş (0 – 1.2): çerçeve, boş terminal + imleç, maskot yazıyor ----
      BK.frame(tl, root, 0);
      BK.slam(tl, "#dm-term", 0.2, { duration: 0.5 });
      BK.mascotIn(tl, "#dm-mascot", 0.25, { from: "right" });
      // Ön gizleme yalnız kaplar için (içindeki öğeler ayrıca oynar): 2. tur bloğu. Tek kez oynayan öğeleri yardımcı zaten gizler.
      BK.fade(tl, "#dm-turn2", 0, { from: 0, to: 0, duration: 0.01 });

      // ---- Adım 1 (1.45 → 4.7): 1. tur ----
      var e = BK.type(tl, "#dm-you1", 1.45, { cps: 22, caret: "#dm-caret1", caretAt: 0.7, hold: 0.12 });
      BK.fade(tl, "#dm-bot1-p", e + 0.15, { duration: 0.12 });
      e = BK.stream(tl, "#dm-bot1", e + 0.2, { wps: 14 });
      BK.termMeta(tl, ["#dm-meta1", "#dm-en1"], e + 0.05);
      BK.termMark(tl, "#dm-mark1", "#dm-note1", 3.85);
      BK.mascotReact(tl, "#dm-mascot", 3.9, { kind: "hop" });

      // ---- Adım 2 (4.75 → 8.0): 2. tur, maskot unutur ----
      BK.fade(tl, "#dm-turn2", 4.75, { duration: 0.1, later: true });
      e = BK.type(tl, "#dm-you2", 4.8, { cps: 22, caret: "#dm-caret2", hold: 0.12 });
      BK.fade(tl, "#dm-bot2-p", e + 0.15, { duration: 0.12 });
      e = BK.stream(tl, "#dm-bot2", e + 0.2, { wps: 14 });
      BK.termMeta(tl, ["#dm-meta2", "#dm-en2"], e + 0.05);
      BK.termMark(tl, "#dm-mark2", "#dm-note2", 7.1);
      BK.mascotSwap(tl, "#dm-mascot", "#dm-pose-a", "#dm-pose-b", 7.2);

      // ---- Adım 3 (8.05 → 9.1): iki ayrı paket; ikisi de in=63 (yalnız sistem promptu + tek mesaj) ----
      BK.dim(tl, "#dm-body", 8.05, { to: 0 });
      BK.slam(tl, "#dm-env1", 8.1, { duration: 0.42 });
      BK.slam(tl, "#dm-env2", 8.2, { duration: 0.42 });
      BK.fade(tl, "#dm-ghost", 8.5, { duration: 0.1 });
      BK.draw(tl, "#dm-strike", 8.52, { duration: 0.22 });
      BK.stamp(tl, "#dm-stamp1", 8.45, { rotation: -3 });
      BK.stamp(tl, "#dm-stamp2", 8.55, { rotation: 3 });
      BK.scan(tl, ["#dm-in1", "#dm-in2"], 8.5, { duration: 0.35, stagger: 0.08 });
      BK.note(tl, "#dm-note3", 8.6);

      // ---- Adım 4 (9.15 → 10.0): çıkarım ----
      BK.slam(tl, "#dm-take", 9.15, { duration: 0.42 });
      BK.mascotReact(tl, "#dm-mascot", 9.2, { kind: "shake" });
    });
  </script>
</template>
